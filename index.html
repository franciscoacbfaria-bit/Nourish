<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f1">
<meta name="description" content="Nourish: a private nutrition and wellness tracker. Meals, foods, photos, activity and daily calorie targets, stored in your browser.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nourish">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Nourish</title>
<style>
/* Layout idea: calm health-journal app — sidebar on wide screens, tab bar on phones,
   summary cards first, detail below. Sage accent on warm-neutral whites. */
:root {
  --bg: #f3f5f1;
  --surface: #ffffff;
  --surface-2: #eef2ec;
  --surface-3: #e4eae1;
  --text: #1b231e;
  --text-2: #5b675f;
  --text-3: #849088;
  --border: #e0e6dd;
  --accent: #7fa383;
  --accent-strong: #4a7352;
  --accent-soft: #e2ebdf;
  --on-accent: #ffffff;

  --protein: #c47f66;
  --carbs: #d3a95c;
  --fat: #7f9fc2;
  --fiber: #6f9a74;
  --activity: #d6845f;

  --good: #3c8a57;
  --warn: #b87a1f;
  --critical: #c0504a;
  --good-soft: #e1f0e5;
  --warn-soft: #f6ecda;
  --critical-soft: #f7e3e1;

  --shadow-sm: 0 1px 2px rgba(27, 35, 30, .05), 0 1px 1px rgba(27, 35, 30, .03);
  --shadow-md: 0 6px 24px -8px rgba(27, 35, 30, .14), 0 2px 6px rgba(27, 35, 30, .05);
  --shadow-lg: 0 24px 60px -16px rgba(27, 35, 30, .28);
  --overlay: rgba(20, 26, 22, .38);

  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-xl: 26px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --sidebar-w: 248px;
  --tabbar-h: 64px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-app-theme="light"]) {
    --bg: #0e1210;
    --surface: #171c19;
    --surface-2: #212823;
    --surface-3: #2c342f;
    --text: #e8eee9;
    --text-2: #a4b0a8;
    --text-3: #7f8b83;
    --border: #2b332e;
    --accent: #86ad8a;
    --accent-strong: #a3c9a7;
    --accent-soft: #223128;
    --on-accent: #0e1210;
    --protein: #d9977e;
    --carbs: #e0bb72;
    --fat: #95b4d6;
    --fiber: #8ab58f;
    --activity: #e59a73;
    --good: #6cc28a;
    --warn: #e2a84d;
    --critical: #ef7f77;
    --good-soft: #1d3326;
    --warn-soft: #382d1b;
    --critical-soft: #3c2321;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-md: 0 10px 30px -10px rgba(0, 0, 0, .65);
    --shadow-lg: 0 28px 70px -12px rgba(0, 0, 0, .75);
    --overlay: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]:not([data-app-theme="light"]),
:root[data-app-theme="dark"] {
  --bg: #0e1210;
    --surface: #171c19;
    --surface-2: #212823;
    --surface-3: #2c342f;
    --text: #e8eee9;
    --text-2: #a4b0a8;
    --text-3: #7f8b83;
    --border: #2b332e;
    --accent: #86ad8a;
    --accent-strong: #a3c9a7;
    --accent-soft: #223128;
    --on-accent: #0e1210;
    --protein: #d9977e;
    --carbs: #e0bb72;
    --fat: #95b4d6;
    --fiber: #8ab58f;
    --activity: #e59a73;
    --good: #6cc28a;
    --warn: #e2a84d;
    --critical: #ef7f77;
    --good-soft: #1d3326;
    --warn-soft: #382d1b;
    --critical-soft: #3c2321;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-md: 0 10px 30px -10px rgba(0, 0, 0, .65);
    --shadow-lg: 0 28px 70px -12px rgba(0, 0, 0, .75);
    --overlay: rgba(0, 0, 0, .55);
    color-scheme: dark;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; line-height: 1.2; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: clamp(28px, 4vw, 34px); font-weight: 700; letter-spacing: -.02em; }
h2 { font-size: 19px; font-weight: 650; }
h3 { font-size: 16px; font-weight: 600; }
p { margin: 0; }
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent-strong); }
.num, .tabular { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); }
.subtle { color: var(--text-3); }
.small { font-size: 13px; }
.xsmall { font-size: 12px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.skip-link { position: absolute; left: 12px; top: -60px; background: var(--accent-strong); color: var(--on-accent); padding: 10px 14px; border-radius: var(--r-sm); z-index: 1000; text-decoration: none; }
.skip-link:focus { top: 12px; }
h1[tabindex="-1"]:focus, .main:focus, .modal:focus { outline: none; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 70%, transparent); outline-offset: 2px; border-radius: 8px; }
.icon { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 24px; height: 24px; }
[hidden] { display: none !important; }

/* ---------- App shell ---------- */
.app { min-height: 100%; display: grid; grid-template-columns: var(--sidebar-w) 1fr; }
.sidebar {
  position: sticky; top: 0; height: 100vh; height: 100dvh;
  display: flex; flex-direction: column; gap: 6px;
  padding: 22px 14px 18px;
  background: color-mix(in srgb, var(--surface) 70%, var(--bg));
  border-right: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; text-decoration: none; color: var(--text); }
.brand-mark { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: linear-gradient(145deg, var(--accent), var(--accent-strong)); color: #fff; box-shadow: var(--shadow-sm); }
.brand-mark .icon { width: 20px; height: 20px; stroke-width: 2; }
.brand-name { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-link {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px;
  color: var(--text-2); text-decoration: none; font-weight: 550; border: 0; background: none; text-align: left; width: 100%;
  transition: background .2s var(--ease), color .2s var(--ease);
}
.nav-link:hover { background: var(--surface-2); color: var(--text); }
.nav-link[aria-current="page"] { background: var(--accent-soft); color: var(--accent-strong); }
.nav-link[aria-current="page"] .icon { stroke-width: 2.1; }
.sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 0 4px; }
.storage-note { font-size: 12px; color: var(--text-3); padding: 0 8px; }

.main { min-width: 0; padding: 28px clamp(16px, 4vw, 44px) 56px; }
.view { max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; animation: viewIn .38s var(--ease) both; }
@keyframes viewIn { from { opacity: .001; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.view-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.view-header .eyebrow { font-size: 13px; font-weight: 600; color: var(--accent-strong); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
.view-header .sub { color: var(--text-2); margin-top: 4px; }
.header-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.tabbar { display: none; }
.fab { display: none; }

/* ---------- Cards ---------- */
.card {
  background: var(--surface); border-radius: var(--r-lg); padding: 20px;
  box-shadow: var(--shadow-sm); border: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
  min-width: 0;
}
.card-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card-header h2 { font-size: 17px; }
.card-title-icon { display: flex; align-items: center; gap: 10px; }
.card-title-icon .bubble { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-strong); }
.card-link { font-size: 14px; font-weight: 600; color: var(--accent-strong); background: none; border: 0; padding: 4px 6px; border-radius: 8px; display: inline-flex; align-items: center; gap: 2px; text-decoration: none; }
.card-link:hover { background: var(--accent-soft); }
.card.interactive { transition: transform .25s var(--ease), box-shadow .25s var(--ease); }
.card.interactive:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }

.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.spacer { flex: 1; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid transparent;
  font-weight: 600; font-size: 15px; line-height: 1; white-space: nowrap;
  background: var(--surface-2); color: var(--text);
  transition: background .2s var(--ease), transform .15s var(--ease), box-shadow .2s var(--ease), color .2s;
}
.btn:hover { background: var(--surface-3); }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--accent-strong); color: var(--on-accent); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.btn-primary:hover { background: color-mix(in srgb, var(--accent-strong) 88%, #000); }
.btn-ghost { background: transparent; color: var(--accent-strong); }
.btn-ghost:hover { background: var(--accent-soft); }
.btn-outline { background: var(--surface); border-color: var(--border); }
.btn-outline:hover { background: var(--surface-2); }
.btn-danger { background: var(--critical-soft); color: var(--critical); }
.btn-danger:hover { background: color-mix(in srgb, var(--critical-soft) 80%, var(--critical)); }
.btn-sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn-block { width: 100%; }
.icon-btn {
  width: 40px; height: 40px; display: inline-grid; place-items: center; border-radius: 12px;
  border: 0; background: transparent; color: var(--text-2); transition: background .2s, color .2s;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn.danger:hover { background: var(--critical-soft); color: var(--critical); }
.icon-btn.filled { background: var(--surface-2); }
.btn[disabled], .icon-btn[disabled] { opacity: .45; cursor: not-allowed; }

/* Segmented control */
.segmented { display: inline-flex; padding: 3px; background: var(--surface-2); border-radius: 12px; gap: 2px; flex-wrap: wrap; }
.segmented input { position: absolute; opacity: 0; pointer-events: none; }
.segmented label, .segmented button {
  padding: 7px 14px; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--text-2);
  cursor: pointer; border: 0; background: none; transition: background .2s var(--ease), color .2s; min-height: 36px; display: inline-flex; align-items: center; gap: 6px;
}
.segmented input:checked + label, .segmented button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
.segmented input:focus-visible + label { outline: 3px solid color-mix(in srgb, var(--accent) 70%, transparent); }

/* Chips */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;
  font-size: 13px; font-weight: 600; background: var(--surface-2); color: var(--text-2); border: 1px solid transparent;
}
button.chip { cursor: pointer; min-height: 34px; }
button.chip:hover { color: var(--text); }
button.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-strong); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.critical { background: var(--critical-soft); color: var(--critical); }
.chip.accent { background: var(--accent-soft); color: var(--accent-strong); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field-label { font-size: 13px; font-weight: 600; color: var(--text-2); }
.field .hint { font-size: 12px; color: var(--text-3); }
.input, .select, .textarea {
  width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  transition: border-color .2s, box-shadow .2s;
}
.textarea { min-height: 84px; resize: vertical; line-height: 1.45; }
.select { appearance: none; -webkit-appearance: none; padding-right: 36px; background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%), linear-gradient(135deg, var(--text-3) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.input[aria-invalid="true"] { border-color: var(--critical); }
.field-error { font-size: 12px; color: var(--critical); font-weight: 600; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.form-grid .span-2 { grid-column: 1 / -1; }
.input-group { display: flex; align-items: stretch; gap: 0; }
.input-group .input { border-radius: 0; text-align: center; }
.input-group .stepper { width: 44px; border: 1px solid var(--border); background: var(--surface-2); display: grid; place-items: center; color: var(--text-2); }
.input-group .stepper:first-child { border-radius: 12px 0 0 12px; border-right: 0; }
.input-group .stepper:last-child { border-radius: 0 12px 12px 0; border-left: 0; }
.input-group .stepper:hover { background: var(--surface-3); color: var(--text); }
.input-suffix { position: relative; }
.input-suffix .input { padding-right: 52px; }
.input-suffix .suffix { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--text-3); pointer-events: none; }
.search { position: relative; }
.search .icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-3); }
.search .input { padding-left: 42px; min-height: 48px; border-radius: 14px; }

/* Switch */
.switch { position: relative; display: inline-flex; align-items: center; gap: 12px; cursor: pointer; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track { width: 46px; height: 28px; border-radius: 999px; background: var(--surface-3); position: relative; transition: background .25s var(--ease); flex: none; }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .25s var(--ease); }
.switch input:checked + .track { background: var(--accent-strong); }
.switch input:checked + .track::after { transform: translateX(18px); }
.switch input:focus-visible + .track { outline: 3px solid color-mix(in srgb, var(--accent) 70%, transparent); outline-offset: 2px; }

/* Combobox */
.combo { position: relative; }
.combo-list {
  position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 30;
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-md);
  max-height: 260px; overflow-y: auto; padding: 6px; margin: 0; list-style: none;
}
.combo-list li { padding: 9px 10px; border-radius: 10px; display: flex; justify-content: space-between; gap: 10px; cursor: pointer; font-size: 14px; }
.combo-list li[aria-selected="true"], .combo-list li:hover { background: var(--accent-soft); }
.combo-list li .meta { color: var(--text-3); font-size: 12px; white-space: nowrap; }

/* ---------- Lists ---------- */
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.list-item {
  display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--border); min-width: 0;
}
.list-item:last-child { border-bottom: 0; }
.list-item .grow { flex: 1; min-width: 0; }
.list-item .title { display: block; font-weight: 600; overflow-wrap: anywhere; }
.list-item .meta { display: block; font-size: 13px; color: var(--text-2); overflow-wrap: anywhere; }
.list-item .value { font-weight: 600; white-space: nowrap; }
.list-item.clickable { cursor: pointer; border-radius: 12px; padding-left: 8px; padding-right: 8px; transition: background .2s; }
.list-item.clickable:hover { background: var(--surface-2); }
.thumb { width: 44px; height: 44px; border-radius: 11px; object-fit: cover; flex: none; background: var(--surface-2); }
.leading { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex: none; background: var(--accent-soft); color: var(--accent-strong); }
.leading.activity { background: color-mix(in srgb, var(--activity) 16%, var(--surface)); color: var(--activity); }

.empty { text-align: center; padding: 26px 16px; color: var(--text-2); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty .icon-wrap { width: 52px; height: 52px; border-radius: 16px; background: var(--surface-2); display: grid; place-items: center; color: var(--text-3); }
.empty.compact { padding: 14px 8px; }

/* ---------- Progress & rings ---------- */
.bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: inherit; background: var(--accent); width: 0; transition: width .8s var(--ease); }
.ring { position: relative; display: grid; place-items: center; }
.ring svg { transform: rotate(-90deg); display: block; }
.ring .track { stroke: var(--surface-2); }
.ring .value { transition: stroke-dashoffset 1s var(--ease); }
.ring-label { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring-label .big { font-family: var(--font-display); font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.05; }
.ring-label .cap { font-size: 12px; color: var(--text-2); font-weight: 600; }

.stat .label { font-size: 13px; color: var(--text-2); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.stat .value { font-family: var(--font-display); font-size: 24px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat .value small { font-size: 14px; font-weight: 600; color: var(--text-2); margin-left: 2px; letter-spacing: 0; }

.macro-row { display: grid; grid-template-columns: 82px 1fr auto; align-items: center; gap: 12px; }
.macro-row + .macro-row { margin-top: 12px; }
.macro-row .name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.macro-row .amt { font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- Banner ---------- */
.banner { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-radius: var(--r-md); background: var(--accent-soft); color: var(--text); flex-wrap: wrap; }
.banner .icon { color: var(--accent-strong); }
.banner .grow { flex: 1; min-width: 220px; }
.banner.warn { background: var(--warn-soft); }
.banner.warn .icon { color: var(--warn); }
.note { font-size: 13px; color: var(--text-2); display: flex; gap: 8px; align-items: flex-start; }
.note .icon { margin-top: 1px; color: var(--text-3); }

/* ---------- Dashboard ---------- */
.dash-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.dash-hero { grid-column: span 7; display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: center; }
.dash-macros { grid-column: span 5; }
.dash-meals { grid-column: span 7; }
.dash-activity { grid-column: span 5; }
.dash-quick { grid-column: span 12; }
.dash-week { grid-column: span 7; }
.dash-recent { grid-column: span 5; }
.hero-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.breakdown { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
.meal-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.meal-tile {
  border: 1px solid var(--border); border-radius: 16px; padding: 14px; background: var(--surface);
  text-align: left; display: flex; flex-direction: column; gap: 8px; transition: background .2s, transform .2s var(--ease), border-color .2s; min-width: 0;
}
.meal-summary { list-style: none; margin: 16px 0 0; padding: 14px 0 0; border-top: 1px solid var(--border); display: grid; gap: 8px; font-size: 14px; }
.meal-summary li { display: grid; grid-template-columns: 84px 1fr; gap: 10px; }
.meal-summary .ms-meal { color: var(--text-3); font-weight: 600; font-size: 13px; }
.meal-summary .ms-foods { color: var(--text-2); overflow-wrap: anywhere; }
.meal-tile:hover { background: var(--surface-2); transform: translateY(-1px); }
.meal-tile .mt-icon { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-strong); }
.meal-tile .mt-name { font-weight: 650; }
.meal-tile .mt-meta { font-size: 13px; color: var(--text-2); }
.meal-tile.done { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
.quick-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.quick {
  display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px; border-radius: 16px;
  background: var(--surface-2); border: 0; text-align: left; font-weight: 600; transition: background .2s, transform .2s var(--ease); min-height: 92px;
}
.quick:hover { background: var(--accent-soft); transform: translateY(-2px); }
.quick .q-icon { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--surface); color: var(--accent-strong); box-shadow: var(--shadow-sm); }
.quick .q-sub { font-size: 12px; color: var(--text-2); font-weight: 500; margin-top: -6px; }

/* ---------- Meals ---------- */
.date-nav { display: inline-flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 3px; }
.date-nav .date-label { position: relative; padding: 0 10px; font-weight: 650; min-width: 168px; text-align: center; display: flex; align-items: center; justify-content: center; min-height: 40px; border-radius: 10px; cursor: pointer; }
.date-nav .date-label:hover { background: var(--surface-2); }
.date-nav .date-input { min-height: 40px; border: 0; background: transparent; width: auto; padding: 6px 8px; font-weight: 600; font-variant-numeric: tabular-nums; border-radius: 10px; }
.date-nav .date-input:hover { background: var(--surface-2); }
.date-nav .date-input:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.summary-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.summary-strip .card { padding: 16px; }
.meal-sections { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.meal-section .card-header { margin-bottom: 4px; }
.meal-section .totals { font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.entry-actions { display: flex; gap: 2px; }
.badge-note { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-3); }

/* ---------- Foods ---------- */
.food-toolbar { display: flex; flex-direction: column; gap: 12px; }
.food-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.food-card {
  text-align: left; border: 1px solid color-mix(in srgb, var(--border) 60%, transparent); background: var(--surface); border-radius: 16px; padding: 16px;
  display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow-sm); transition: transform .2s var(--ease), box-shadow .2s var(--ease); min-width: 0;
}
.food-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.food-card .fc-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.food-card .fc-name { display: block; font-weight: 650; overflow-wrap: anywhere; }
.food-card .fc-kcal { font-family: var(--font-display); font-weight: 700; font-size: 18px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.food-card .fc-kcal small { font-size: 12px; color: var(--text-3); font-weight: 600; }
.macro-stack { display: flex; height: 6px; border-radius: 999px; overflow: hidden; background: var(--surface-2); }
.macro-stack span { display: block; height: 100%; }
.macro-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.macro-legend span { display: inline-flex; align-items: center; gap: 5px; }
.nutri-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.nutri-table th, .nutri-table td { padding: 10px 6px; border-bottom: 1px solid var(--border); text-align: left; font-size: 14px; }
.nutri-table th { font-weight: 600; color: var(--text-2); }
.nutri-table td.r, .nutri-table th.r { text-align: right; }
.nutri-table tr:last-child td { border-bottom: 0; }
.table-wrap { overflow-x: auto; }

/* ---------- Journal ---------- */
.journal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.photo-card { padding: 0; overflow: hidden; display: flex; flex-direction: column; text-align: left; border: 0; cursor: pointer; transition: transform .25s var(--ease), box-shadow .25s var(--ease); }
.photo-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
.photo-card img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: var(--surface-2); }
.photo-card .pc-body > span { display: block; }
.photo-card .pc-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; }
.photo-card .pc-body .pc-desc { font-size: 14px; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.photo-drop { border: 2px dashed var(--border); border-radius: 16px; padding: 18px; display: flex; gap: 14px; align-items: center; background: var(--surface-2); flex-wrap: wrap; }
.photo-drop.dragging { border-color: var(--accent); background: var(--accent-soft); }
.photo-preview { position: relative; border-radius: 14px; overflow: hidden; }
.photo-preview img { width: 100%; max-height: 260px; object-fit: cover; }
.photo-preview .icon-btn { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,.55); color: #fff; }
.viewer-img { width: 100%; max-height: 62vh; object-fit: contain; border-radius: 14px; background: var(--surface-2); }

/* ---------- Activity ---------- */
.week-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
.day-card { padding: 14px; display: flex; flex-direction: column; gap: 10px; min-height: 180px; }
.day-card.today { border-color: color-mix(in srgb, var(--accent) 60%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent), var(--shadow-sm); }
.day-card .dc-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.day-card .dc-day { font-weight: 700; font-family: var(--font-display); }
.day-card .dc-date { font-size: 12px; color: var(--text-3); }
.day-card .dc-items { display: flex; flex-direction: column; gap: 6px; flex: 1; }
.act-pill {
  border: 0; text-align: left; background: color-mix(in srgb, var(--activity) 10%, var(--surface)); color: var(--text);
  border-radius: 10px; padding: 8px 10px; font-size: 13px; display: flex; flex-direction: column; gap: 1px; transition: background .2s;
}
.act-pill:hover { background: color-mix(in srgb, var(--activity) 18%, var(--surface)); }
.act-pill .ap-name { font-weight: 650; overflow-wrap: anywhere; }
.act-pill .ap-meta { color: var(--text-2); font-size: 12px; font-variant-numeric: tabular-nums; }
.day-card .dc-foot { font-size: 12px; color: var(--text-2); border-top: 1px solid var(--border); padding-top: 8px; display: flex; flex-direction: column; gap: 2px; font-variant-numeric: tabular-nums; }
.day-card .dc-foot span:last-child { color: var(--text); font-weight: 600; }
body[data-view="assistant"] .fab { display: none; }
.plan-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }

/* ---------- Charts ---------- */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--text-3); font-size: 11px; font-family: var(--font-body); }
.chart .grid-line { stroke: var(--border); stroke-width: 1; }
.chart .bar-intake { fill: var(--accent); }
.chart .bar-over { fill: var(--warn); }
.chart .bar-activity { fill: var(--activity); }
.chart .bar-empty { fill: var(--surface-2); }
.chart .target-line { stroke: var(--text-2); stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
.chart .trend-line { stroke: var(--accent-strong); stroke-width: 2.5; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.chart .trend-area { fill: color-mix(in srgb, var(--accent) 18%, transparent); }
.chart .point { fill: var(--surface); stroke: var(--accent-strong); stroke-width: 2.5; }
.chart .label-strong { fill: var(--text); font-weight: 600; }
.chart .bar-hit { fill: transparent; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend .sw.line { height: 0; border-top: 2px dashed var(--text-2); border-radius: 0; width: 14px; }

.consistency { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.consistency .cell { aspect-ratio: 1; border-radius: 7px; background: var(--surface-2); display: grid; place-items: center; font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; border: 0; padding: 0; }
.consistency .cell.l1 { background: color-mix(in srgb, var(--accent) 30%, var(--surface-2)); color: var(--text-2); }
.consistency .cell.l2 { background: color-mix(in srgb, var(--accent) 60%, var(--surface-2)); color: var(--text); }
.consistency .cell.l3 { background: var(--accent-strong); color: var(--on-accent); }
.consistency .cell.future { opacity: .35; }
.consistency .head { font-size: 11px; color: var(--text-3); text-align: center; font-weight: 600; }


/* ---------- Goals and weekly plan ---------- */
.goal-options { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.goal-option { position: relative; }
.goal-option input { position: absolute; opacity: 0; pointer-events: none; }
.goal-option label { display: flex; flex-direction: column; gap: 2px; height: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 14px; cursor: pointer; background: var(--surface); transition: border-color .2s, background .2s, box-shadow .2s; }
.goal-option label:hover { background: var(--surface-2); }
.goal-option label strong { font-size: 14px; }
.goal-option label span { font-size: 12px; color: var(--text-2); }
.goal-option input:checked + label { border-color: var(--accent-strong); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent-strong); }
.goal-option input:disabled + label { opacity: .45; cursor: not-allowed; }
.goal-option input:disabled + label:hover { background: var(--surface); }
.goal-option input:focus-visible + label { outline: 3px solid color-mix(in srgb, var(--accent) 70%, transparent); outline-offset: 2px; }
.chip.training { background: color-mix(in srgb, var(--activity) 18%, var(--surface)); color: var(--text); }
.chip.training .icon { color: var(--activity); }
.chip.rest { background: var(--surface-2); color: var(--text-2); }
.plan-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.plan-table th, .plan-table td { padding: 8px 6px; border-bottom: 1px solid var(--border); text-align: left; font-size: 14px; vertical-align: middle; }
.plan-table thead th { font-size: 12px; color: var(--text-2); font-weight: 600; }
.plan-table tbody th { font-weight: 600; white-space: nowrap; }
.plan-table .input-suffix { max-width: 170px; }
.plan-table .input { min-height: 40px; padding-top: 6px; padding-bottom: 6px; }
.plan-table td.r, .plan-table th.r { text-align: right; }
.plan-table tr:last-child th, .plan-table tr:last-child td { border-bottom: 0; }
.d-short { display: none; }

.day-toggle { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px 0 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); font-size: 13px; font-weight: 600; white-space: nowrap; transition: background .2s, border-color .2s, color .2s, transform .15s var(--ease); }
.day-toggle:hover { border-color: var(--accent); color: var(--text); }
.day-toggle:active { transform: scale(.97); }
.day-toggle.training { background: color-mix(in srgb, var(--activity) 18%, var(--surface)); border-color: color-mix(in srgb, var(--activity) 45%, transparent); color: var(--text); }
.day-toggle.training > .icon:first-child { color: var(--activity); }
.day-toggle .swap { display: inline-flex; opacity: .5; margin-left: 2px; }
.day-toggle:hover .swap { opacity: .9; }
.t-short { display: none; }

/* ---------- Assistant ---------- */
.chat-card { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
.chat-log { display: flex; flex-direction: column; gap: 12px; padding: 20px; min-height: 340px; max-height: calc(100vh - 340px); max-height: calc(100dvh - 340px); overflow-y: auto; overscroll-behavior: contain; }
.msg { max-width: min(80%, 640px); padding: 11px 15px; border-radius: 18px; line-height: 1.45; overflow-wrap: anywhere; animation: popIn .25s var(--ease) both; }
.msg p + p { margin-top: 6px; }
.msg ul { margin: 6px 0 0; padding-left: 18px; }
.msg.user { align-self: flex-end; background: var(--accent-strong); color: var(--on-accent); border-bottom-right-radius: 6px; }
.msg.assistant { align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 6px; }
.msg ul.msg-changes { list-style: none; margin: 10px 0 0; padding: 10px 0 0; border-top: 1px solid var(--border); display: grid; gap: 6px; font-size: 13px; }
.msg-changes li { display: flex; gap: 8px; align-items: flex-start; }
.msg-changes .icon { color: var(--good); margin-top: 2px; }
.msg-changes li.err .icon { color: var(--warn); }
.typing { display: inline-flex; gap: 5px; align-items: center; padding: 15px 16px; }
.typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); animation: blink 1.2s infinite both; }
.typing span:nth-child(2) { animation-delay: .15s; }
.typing span:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-2px); } }
.chat-quick { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 20px 14px; }
.composer { display: flex; gap: 10px; align-items: flex-end; padding: 12px 14px; border-top: 1px solid var(--border); background: var(--surface); }
.composer .textarea { flex: 1; min-height: 46px; max-height: 160px; resize: none; border-radius: 14px; padding-top: 12px; }
.composer-btn { min-height: 46px; }

.msg-links { margin-top: 10px; gap: 8px; }
.msg-links .btn { background: var(--surface); }
.card.flash { animation: flash 1.7s var(--ease); }
@keyframes flash { 0%, 100% { box-shadow: var(--shadow-sm); } 25% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 45%, transparent), var(--shadow-md); } }

/* ---------- Settings ---------- */
#profile-card, #weekly-plan, #prefs-card, #data-card { scroll-margin-top: 20px; }
.history-top { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); align-items: start; }
.settings-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.setting-row:last-child { border-bottom: 0; }
.setting-row .sr-text { flex: 1; min-width: 200px; }
.setting-row .sr-title { font-weight: 600; }
.setting-row .sr-desc { font-size: 13px; color: var(--text-2); }
.calc-box { background: var(--surface-2); border-radius: var(--r-md); padding: 14px 16px; display: grid; gap: 6px; font-variant-numeric: tabular-nums; }
.calc-box .cb-row { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.calc-box .cb-row.total { font-weight: 700; border-top: 1px solid var(--border); padding-top: 8px; margin-top: 2px; font-size: 15px; }
.sources { font-size: 13px; color: var(--text-2); padding-left: 18px; margin: 8px 0 0; display: grid; gap: 4px; }

/* ---------- Modal / sheet ---------- */
.modal-root { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; padding: 20px; }
.modal-backdrop { position: absolute; inset: 0; background: var(--overlay); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); animation: fadeIn .25s var(--ease) both; }
.modal {
  position: relative; width: min(560px, 100%); max-height: min(88vh, 860px); overflow: hidden; display: flex; flex-direction: column;
  background: var(--surface); border-radius: var(--r-xl); box-shadow: var(--shadow-lg); animation: popIn .32s var(--ease) both;
}
.modal.wide { width: min(760px, 100%); }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 10px; }
.modal-head h2 { font-size: 19px; }
.modal-body { padding: 6px 20px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; overscroll-behavior: contain; }
.modal-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 14px 20px 18px; border-top: 1px solid var(--border); background: var(--surface); flex-wrap: wrap; }
.modal-foot .left { margin-right: auto; }
.modal .grabber { display: none; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popIn { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
.modal-root.closing .modal { animation: popOut .2s var(--ease) both; }
.modal-root.closing .modal-backdrop { animation: fadeOut .2s var(--ease) both; }
@keyframes popOut { to { opacity: 0; transform: translateY(8px) scale(.98); } }
@keyframes fadeOut { to { opacity: 0; } }

.nutri-preview { border-radius: var(--r-md); background: var(--surface-2); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.nutri-preview .np-main { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.nutri-preview .np-kcal { font-family: var(--font-display); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.nutri-preview.unknown { background: var(--warn-soft); }
.portion-chips { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- Toast ---------- */
.toasts { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 400; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(460px, calc(100% - 32px)); }
.toast {
  pointer-events: auto; display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 16px; border-radius: 14px; width: 100%;
  background: color-mix(in srgb, var(--text) 92%, transparent); color: var(--bg); box-shadow: var(--shadow-lg); animation: popIn .3s var(--ease) both; font-size: 14px; font-weight: 500;
}
.toast .grow { flex: 1; }
.toast button { background: none; border: 0; color: inherit; font-weight: 700; padding: 6px 8px; border-radius: 8px; text-decoration: underline; text-underline-offset: 3px; }
.toast.error { background: var(--critical); color: #fff; }

/* ---------- More sheet (mobile) ---------- */
.more-list { display: grid; gap: 8px; }
.more-list .nav-link { background: var(--surface-2); padding: 14px; font-size: 16px; color: var(--text); }

/* ---------- Responsive ---------- */
@media (max-width: 1180px) {
  .quick-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .week-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .plan-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (max-width: 1040px) {
  .dash-hero, .dash-macros, .dash-meals, .dash-activity, .dash-week, .dash-recent { grid-column: span 12; }
  .settings-grid, .history-top { grid-template-columns: 1fr; }
}
@media (max-width: 899px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .main { padding: 18px 16px calc(var(--tabbar-h) + 34px + env(safe-area-inset-bottom)); padding-top: calc(18px + env(safe-area-inset-top)); }
  .tabbar {
    display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: saturate(1.6) blur(18px); -webkit-backdrop-filter: saturate(1.6) blur(18px);
    border-top: 1px solid var(--border);
  }
  .tab {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px;
    font-size: 11px; font-weight: 600; color: var(--text-3); text-decoration: none; border: 0; background: none; border-radius: 12px;
  }
  .tab .icon { width: 24px; height: 24px; }
  .tab[aria-current="page"] { color: var(--accent-strong); }
  .fab {
    display: grid; place-items: center; position: fixed; right: 18px; bottom: calc(var(--tabbar-h) + 18px + env(safe-area-inset-bottom)); z-index: 101;
    width: 56px; height: 56px; border-radius: 18px; border: 0; background: var(--accent-strong); color: var(--on-accent); box-shadow: var(--shadow-lg);
    transition: transform .2s var(--ease);
  }
  .fab:active { transform: scale(.94); }
  .fab .icon { width: 26px; height: 26px; stroke-width: 2.2; }
  .toasts { bottom: calc(var(--tabbar-h) + 24px + env(safe-area-inset-bottom)); }

  .modal-root { place-items: end center; padding: 0; }
  .modal, .modal.wide { width: 100%; max-height: 92vh; max-height: 92dvh; border-radius: 26px 26px 0 0; animation: sheetUp .38s var(--ease) both; }
  .modal-root.closing .modal { animation: sheetDown .24s var(--ease) both; }
  @keyframes sheetDown { to { transform: translateY(100%); } }
  .modal .grabber { display: block; width: 38px; height: 5px; border-radius: 999px; background: var(--surface-3); margin: 8px auto 0; }
  .modal-head { padding-top: 10px; }
  .modal-foot { padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  .modal-foot .btn { flex: 1; }
  .modal-foot .left { flex: 0 0 auto; }

  .meal-sections { grid-template-columns: 1fr; }
  .chat-log { min-height: 260px; max-height: calc(100vh - 360px - var(--tabbar-h)); max-height: calc(100dvh - 360px - var(--tabbar-h)); padding: 16px; }
  .msg { max-width: 88%; }
  .summary-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-3, .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  body { font-size: 15px; }
  .card { padding: 16px; border-radius: 18px; }
  .dash-hero { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .dash-hero .hero-stats { width: 100%; }
  .dash-hero .breakdown { justify-content: center; }
  .meal-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .quick-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .quick { min-height: 84px; padding: 12px; }
  .quick .q-sub { display: none; }
  .week-grid { grid-template-columns: 1fr; }
  .day-card { min-height: 0; }
  .plan-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .form-grid { grid-template-columns: 1fr; }
  .grid-2 { grid-template-columns: 1fr; }
  .view-header { align-items: flex-start; }
  .view-header .header-actions { width: 100%; }
  .date-nav { width: 100%; justify-content: space-between; }
  .date-nav .date-label { flex: 1; min-width: 0; }
  .journal-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .photo-card .pc-body > span { display: block; }
.photo-card .pc-body { padding: 10px; }
  .food-grid { grid-template-columns: 1fr; }
  .macro-row { grid-template-columns: 70px 1fr auto; }
  .d-long { display: none; }
  .d-short { display: inline; }
  .t-long { display: none; }
  .t-short { display: inline; }
  .day-toggle { padding: 0 8px; gap: 4px; }
  .plan-table th, .plan-table td { padding: 8px 3px; }
  .plan-table .input-suffix { max-width: 84px; }
  .plan-table .input-suffix .input { padding-right: 8px; padding-left: 10px; }
  .plan-table .input-suffix .suffix { display: none; }
  .plan-table .chip { padding: 5px 8px; }
  .goal-options { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .chat-quick { padding: 0 16px 12px; }
}
@media (max-width: 380px) {
  .hero-stats { grid-template-columns: 1fr 1fr; }
  .summary-strip { grid-template-columns: 1fr 1fr; }
  .quick-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}

  const LIFESTYLES = [

    { key: 'active', label: 'Physically demanding work', desc: 'Manual or very active job', factor: 1.55 }

  // The goal sets the protein target (g per kg of body weight). Calories follow rest and training days.
  const GOALS = [
    { key: 'lose-fat', label: 'Lose fat', short: 'Trim fat, keep muscle', desc: 'Protein target 1.6 g per kg of body weight, to help protect muscle.', proteinPerKg: 1.6 },

    { key: 'gain-muscle', label: 'Gain muscle', short: 'Build lean mass', desc: 'Protein target 1.6 g per kg of body weight, to support muscle growth.', proteinPerKg: 1.6 },

  ];
  const GOAL_MAP = Object.fromEntries(GOALS.map(g => [g.key, g]));
  const LEGACY_GOALS = { 'lose-0.5': 'lose-weight', 'lose-0.25': 'lose-fat', 'gain-0.25': 'gain-muscle' };
  const REST_DAY_ADJ = -300;     // kcal vs maintenance on rest days
  const TRAINING_DAY_ADJ = 200;  // kcal vs maintenance on training days
  const KCAL_PER_KG = 7700;      // approximate energy in 1 kg of body fat
  const WEEKDAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const WEEKDAYS_LONG = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
  const WEEKDAY_KEYS = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];

  const FOOD_MAP = Object.fromEntries(FOOD_DB.map(f => [f.id, f]));
  const CAT_MAP = Object.fromEntries(FOOD_CATEGORIES.map(c => [c.key, c.label]));

  /* =========================================================
     2. Helpers
     ========================================================= */
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const round = (v, dp = 0) => { const m = Math.pow(10, dp); return Math.round(v * m) / m; };
  const num = (v) => {
    if (v === '' || v == null) return null;
    const n = Number(String(v).replace(',', '.'));
    return Number.isFinite(n) ? n : null;
  };
  const fmtNum = (v, dp = 0) => (v == null || !Number.isFinite(v)) ? '—'
    : v.toLocaleString('en-US', { maximumFractionDigits: dp, minimumFractionDigits: 0 });
  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  const icon = (name, cls = '') => `<svg class="icon ${cls}" aria-hidden="true" focusable="false"><use href="#i-${name}"></use></svg>`;
  const normalize = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const plural = (n, one, many) => `${fmtNum(n, 2)} ${n === 1 ? one : many}`;
  const isMobile = () => window.matchMedia('(max-width: 899px)').matches;

  // Dates are stored as local "YYYY-MM-DD" keys. Noon avoids daylight-saving edge cases.
  const pad = (n) => String(n).padStart(2, '0');
  const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseKey = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); };
  const todayKey = () => keyOf(new Date());
  const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
  const weekdayIdx = (k) => (parseKey(k).getDay() + 6) % 7; // Monday = 0
  const weekStartOf = (k) => addDays(k, -weekdayIdx(k));
  const isValidKey = (k) => typeof k === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(k) && !isNaN(parseKey(k));
  const fmtDate = (k, opts) => parseKey(k).toLocaleDateString('en-US', opts);
  const longDate = (k) => fmtDate(k, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  const shortDate = (k) => fmtDate(k, { month: 'short', day: 'numeric' });
  function relDay(k) {
    const t = todayKey();
    if (k === t) return 'Today';
    if (k === addDays(t, -1)) return 'Yesterday';
    if (k === addDays(t, 1)) return 'Tomorrow';
    return fmtDate(k, { weekday: 'short', month: 'short', day: 'numeric' });
  }
  function weekRangeLabel(start) {
    const end = addDays(start, 6);
    const sameYear = parseKey(start).getFullYear() === parseKey(end).getFullYear();
    const a = fmtDate(start, { weekday: 'short', month: 'short', day: 'numeric', year: sameYear ? undefined : 'numeric' });
    const b = fmtDate(end, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
    return `${a} – ${b}`;
  }
  function mealForNow() {
    const h = new Date().getHours() + new Date().getMinutes() / 60;
    if (h < 10.5) return 'breakfast';
    if (h < 15) return 'lunch';
    if (h < 18) return 'snacks';
    if (h < 22.5) return 'dinner';
    return 'snacks';
  }
  function greeting() {
    const h = new Date().getHours();
    return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
  }

  /* =========================================================
     3. Storage (localStorage, with graceful failure)
     ========================================================= */
  const Store = {
    available: (() => {
      try { const k = '__nourish_test__'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; }
      catch (e) { return false; }
    })(),
    memoryPhotos: {},
    load() {
      if (!this.available) return null;
      try { const raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : null; }
      catch (e) { console.warn('Nourish: could not read saved data', e); return null; }
    },
    save(data) {
      if (!this.available) return true;
      try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); return true; }
      catch (e) { console.warn('Nourish: could not save', e); return false; }
    },
    getPhoto(id) {
      if (!id) return null;
      if (!this.available) return this.memoryPhotos[id] || null;
      try { return localStorage.getItem(PHOTO_PREFIX + id); } catch (e) { return null; }
    },
    setPhoto(id, dataUrl) {
      if (!this.available) { this.memoryPhotos[id] = dataUrl; return true; }
      try { localStorage.setItem(PHOTO_PREFIX + id, dataUrl); return true; }
      catch (e) { console.warn('Nourish: photo not saved', e); return false; }
    },
    removePhoto(id) {
      if (!id) return;
      if (!this.available) { delete this.memoryPhotos[id]; return; }
      try { localStorage.removeItem(PHOTO_PREFIX + id); } catch (e) { /* ignore */ }
    },
    photoIds() {
      if (!this.available) return Object.keys(this.memoryPhotos);
      const ids = [];
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith(PHOTO_PREFIX)) ids.push(k.slice(PHOTO_PREFIX.length));
        }
      } catch (e) { /* ignore */ }
      return ids;
    },
    usage() {
      let total = 0, photos = 0;
      if (!this.available) return { total, photos };
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (!k || !k.startsWith('nourish.')) continue;
          const size = (k.length + (localStorage.getItem(k) || '').length) * 2; // UTF-16
          total += size;
          if (k.startsWith(PHOTO_PREFIX)) photos += size;
        }
      } catch (e) { /* ignore */ }
      return { total, photos };
    },
    clearAll() {
      if (!this.available) { this.memoryPhotos = {}; return; }
      try {
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith('nourish.')) keys.push(k);
        }
        keys.forEach(k => localStorage.removeItem(k));
      } catch (e) { /* ignore */ }
    }
  };

  /* =========================================================
     4. State
     ========================================================= */
  function blankProfile() {
    return { name: '', sex: '', age: null, heightCm: null, weightKg: null, lifestyle: 'seated', goal: 'maintain', goalChosen: false, demo: false };
  }
  function defaultState() {
    return {
      version: 1,
      profile: blankProfile(),
      settings: { theme: 'system', units: 'metric', energy: 'kcal', useLoggedBurn: true },
      weeklyPlan: [0, 0, 0, 0, 0, 0, 0],
      weeklyTraining: [false, false, false, false, false, false, false],
      entries: [],
      activities: [],
      customFoods: [],
      chat: [],
      meta: { createdAt: Date.now(), demoActive: false, demoPlan: false, lastSaved: null }
    };
  }
  function sanitizeState(s) {
    const d = defaultState();
    if (!s || typeof s !== 'object') return d;
    const out = {
      version: 1,
      profile: Object.assign(blankProfile(), s.profile || {}),
      settings: Object.assign(d.settings, s.settings || {}),
      weeklyPlan: Array.isArray(s.weeklyPlan) && s.weeklyPlan.length === 7 ? s.weeklyPlan.map(v => Math.max(0, num(v) || 0)) : d.weeklyPlan,
      weeklyTraining: d.weeklyTraining,
      entries: Array.isArray(s.entries) ? s.entries.filter(e => e && e.id && isValidKey(e.date) && MEAL_MAP[e.meal]) : [],
      activities: Array.isArray(s.activities) ? s.activities.filter(a => a && a.id && isValidKey(a.date)) : [],
      customFoods: Array.isArray(s.customFoods) ? s.customFoods.filter(f => f && f.id && f.name) : [],
      chat: Array.isArray(s.chat) ? s.chat.filter(m => m && (m.role === 'user' || m.role === 'assistant') && typeof m.text === 'string').slice(-60) : [],
      meta: Object.assign(d.meta, s.meta || {})
    };
    out.entries.forEach(e => { e.qty = num(e.qty) || 0; if (!UNIT_MAP[e.unit]) e.unit = 'g'; });
    out.activities.forEach(a => { a.duration = num(a.duration) || 0; a.kcal = num(a.kcal); });
    if (LEGACY_GOALS[out.profile.goal]) { out.profile.goal = LEGACY_GOALS[out.profile.goal]; out.profile.goalChosen = true; }
    if (!GOAL_MAP[out.profile.goal]) out.profile.goal = 'maintain';
    ['restAdj', 'trainingAdj', 'trainingThreshold'].forEach(k => { delete out.profile[k]; });
    // Rest or training day for each weekday, chosen by the user. Older data: days with ≥150 kcal planned were training days.
    out.weeklyTraining = Array.isArray(s.weeklyTraining) && s.weeklyTraining.length === 7 ? s.weeklyTraining.map(Boolean) : out.weeklyPlan.map(v => v >= 150);
    return out;
  }

  /* =========================================================
     5. Domain logic
     ========================================================= */
  const allFoods = () => FOOD_DB.concat(state.customFoods);
  const findFood = (id) => FOOD_MAP[id] || state.customFoods.find(f => f.id === id) || null;
  const catLabel = (key) => CAT_MAP[key] || 'Other';
  const snapFood = (f) => f ? { name: f.name, kcal: f.kcal, p: f.p, c: f.c, f: f.f, fib: f.fib, ml: f.ml || null, sv: f.sv || {} } : null;

  function searchFoods(q, cat = 'all', limit = Infinity) {
    let list = cat === 'custom' ? state.customFoods.slice() : cat === 'all' ? allFoods() : allFoods().filter(f => f.cat === cat);
    const nq = normalize(q).trim();
    if (!nq) return list.sort((a, b) => a.name.localeCompare(b.name)).slice(0, limit);
    const terms = nq.split(/\s+/);
    const scored = [];
    for (const f of list) {
      const name = normalize(f.name);
      const words = name.split(/[\s,()–-]+/);
      const aka = normalize(f.aka || '');
      const akaWords = aka.split(/[\s-]+/);
      let score = 0, ok = true;
      for (const t of terms) {
        let s = 0;
        if (name.startsWith(t)) s = 4;
        else if (words.some(w => w.startsWith(t))) s = 3;
        else if (akaWords.some(w => w.startsWith(t))) s = 2.5;
        else if (name.includes(t)) s = 1.5;
        else if (aka.includes(t)) s = 1;
        if (!s) { ok = false; break; }
        score += s;
      }
      if (ok) scored.push([score, f]);
    }
    scored.sort((a, b) => b[0] - a[0] || a[1].name.length - b[1].name.length);
    return scored.slice(0, limit).map(x => x[1]);
  }

  /** Grams in ONE unit of this food, or null when no reliable conversion exists. */
  function unitGrams(food, unit) {
    if (unit === 'g') return 1;
    if (!food) return null;
    const sv = food.sv || {};
    const ml = food.ml || null;
    switch (unit) {
      case 'ml': return ml;
      case 'cup': return sv.cup ? sv.cup[0] : ml ? CUP_ML * ml : null;
      case 'tbsp': return sv.tbsp ? sv.tbsp[0] : ml ? TBSP_ML * ml : null;
      case 'tsp': return sv.tsp ? sv.tsp[0] : ml ? TSP_ML * ml : null;
      case 'piece': return sv.piece ? sv.piece[0] : null;
      case 'serving': return sv.serving ? sv.serving[0] : null;
      default: return null;
    }
  }

  function defaultPortion(food) {
    if (!food) return { qty: 1, unit: 'serving' };
    const sv = food.sv || {};
    if (sv.piece) return { qty: 1, unit: 'piece' };
    if (sv.serving) return { qty: 1, unit: 'serving' };
    if (food.cat === 'drink' && food.ml) return { qty: 250, unit: 'ml' };
    if (sv.cup) return { qty: 1, unit: 'cup' };
    if (sv.tbsp) return { qty: 1, unit: 'tbsp' };
    if (sv.tsp) return { qty: 1, unit: 'tsp' };
    return { qty: 100, unit: 'g' };
  }

  /** Nutrition for an entry. `known` is false when no reliable data or conversion exists. */
  function entryNutrition(e) {
    const food = (e.foodId && findFood(e.foodId)) || (e.foodId && e.snap) || null;
    if (food) {
      const per = unitGrams(food, e.unit);
      let grams = per != null ? e.qty * per : (num(e.gramsEq) > 0 ? num(e.gramsEq) : null);
      if (grams != null) {
        const k = grams / 100;
        return { known: true, grams, kcal: food.kcal * k, p: food.p * k, c: food.c * k, f: food.f * k, fib: (food.fib || 0) * k, source: per != null ? 'food' : 'grams' };
      }
      return { known: false, reason: 'unit' };
    }
    if (num(e.kcalManual) != null) {
      return { known: true, grams: e.unit === 'g' ? e.qty : null, kcal: num(e.kcalManual), p: null, c: null, f: null, fib: null, source: 'manual' };
    }
    return { known: false, reason: 'food' };
  }

  const entriesFor = (date) => state.entries.filter(e => e.date === date).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  const activitiesFor = (date) => state.activities.filter(a => a.date === date).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

  function sumNutrition(entries) {
    const t = { kcal: 0, p: 0, c: 0, f: 0, fib: 0, count: entries.length, unknown: 0, known: 0 };
    for (const e of entries) {
      const n = entryNutrition(e);
      if (!n.known) { t.unknown++; continue; }
      t.known++;
      t.kcal += n.kcal;
      if (n.p != null) { t.p += n.p; t.c += n.c; t.f += n.f; t.fib += n.fib; }
    }
    return t;
  }
  const dayTotals = (date) => sumNutrition(entriesFor(date));

  function activityTotals(date) {
    const list = activitiesFor(date);
    return {
      count: list.length,
      minutes: list.reduce((s, a) => s + (a.duration || 0), 0),
      kcal: list.reduce((s, a) => s + (a.kcal || 0), 0)
    };
  }

  const isTeen = (p = state.profile) => p.age != null && p.age >= MIN_AGE && p.age < 18;
  const LW = () => isTeen() ? 'target' : 'limit';
  const fiberReference = (p = state.profile) => isTeen(p) ? (p.age <= 14 ? 19 : 21) : FIBER_REFERENCE_G;
  /** Teens: IOM estimated energy requirement (includes energy for growth), without workouts. */
  function teenEnergyNeeds(p) {
    const h = p.heightCm / 100, w = p.weightKg, a = p.age, l = TEEN_PA.male[p.lifestyle] ? p.lifestyle : 'seated';
    const boy = 88.5 - 61.9 * a + TEEN_PA.male[l] * (26.7 * w + 903 * h) + 25;
    const girl = 135.3 - 30.8 * a + TEEN_PA.female[l] * (10.0 * w + 934 * h) + 25;
    return p.sex === 'male' ? boy : p.sex === 'female' ? girl : (boy + girl) / 2;
  }
  const profileComplete = (p = state.profile) => !!(p.sex && p.age > 0 && p.heightCm > 0 && p.weightKg > 0);
  /** Mifflin-St Jeor resting energy. "Prefer not to say" uses the midpoint of the two constants. */
  function bmrOf(p) {
    const s = p.sex === 'male' ? 5 : p.sex === 'female' ? -161 : -78;
    return 10 * p.weightKg + 6.25 * p.heightCm - 5 * p.age + s;
  }
  function exerciseFor(date) {
    const logged = activityTotals(date).kcal;
    const planned = state.weeklyPlan[weekdayIdx(date)] || 0;
    if (state.settings.useLoggedBurn && logged > 0) return { kcal: logged, source: 'logged' };
    if (planned > 0) return { kcal: planned, source: 'planned' };
    return { kcal: 0, source: 'none' };
  }
  const goalOf = (p = state.profile) => GOAL_MAP[p.goal] || GOAL_MAP.maintain;
  /**
   * Calorie limit for a day: maintenance (resting energy × daily-life factor, or teen energy needs,
   * plus that day's exercise) − 300 kcal on a rest day or + 200 kcal on a training day.
   * Adults never go below the safety floor; under-18s are never below their energy needs.
   */
  function computeTarget(burnKcal, training, profile = state.profile) {
    if (!profileComplete(profile)) return null;
    const teen = isTeen(profile);
    const life = LIFESTYLES.find(l => l.key === profile.lifestyle) || LIFESTYLES[0];
    const bmr = teen ? null : bmrOf(profile);
    const goal = goalOf(profile);
    const base = teen ? teenEnergyNeeds(profile) : bmr * life.factor;
    const maintenance = base + (burnKcal || 0);
    const dayType = training ? 'training' : 'rest';
    let adj = training ? TRAINING_DAY_ADJ : REST_DAY_ADJ;
    if (teen && adj < 0) adj = 0; // no calorie decrease for under-18s
    const floor = profile.sex === 'male' ? 1500 : 1200;
    const raw = maintenance + adj;
    let total = adj < 0 ? Math.max(raw, Math.min(floor, maintenance)) : raw;
    const floored = total > raw + 0.5;
    total = Math.round(total / 10) * 10;
    const effAdj = floored ? Math.round(total - maintenance) : adj; // what actually applies
    return { bmr, base, teen, factor: life.factor, life, goal, exercise: burnKcal || 0, maintenance, dayType, goalAdj: adj, effAdj, total, floor, floored };
  }
  const isTrainingDay = (date) => !!state.weeklyTraining[weekdayIdx(date)];
  function targetFor(date, profile = state.profile) {
    const ex = exerciseFor(date);
    const t = computeTarget(ex.kcal, isTrainingDay(date), profile);
    if (t) t.source = ex.source;
    return t;
  }
  const proteinPerKg = (p = state.profile) => isTeen(p) ? TEEN_PROTEIN_G_PER_KG : goalOf(p).proteinPerKg;
  const proteinReference = () => state.profile.weightKg ? state.profile.weightKg * proteinPerKg() : null;
  const LOSS_GOALS = ['lose-fat', 'lose-weight'];
  /** Under-18 profiles never keep a weight-loss goal. Returns true if anything changed. */
  function enforceTeenRules(p) {
    if (!isTeen(p)) return false;
    let changed = false;
    if (LOSS_GOALS.includes(p.goal)) { p.goal = 'maintain'; changed = true; }
    return changed;
  }
  const fmtPT = (v) => Math.round(v).toLocaleString('pt-PT');
  const signedE = (kcal) => Math.round(kcal) === 0 ? 'maintenance' : `${kcal > 0 ? '+' : '−'}${E(Math.abs(kcal))}`;
  const dayTypeChip = (type) => `<span class="chip ${type === 'training' ? 'training' : 'rest'}">${icon(type === 'training' ? 'activity' : 'moon', 'icon-sm')} ${type === 'training' ? 'Training day' : 'Rest day'}</span>`;
  /** Weekly balance relative to maintenance, for 7 burn estimates (kcal) and 7 training-day flags. */
  function planBalance(planArr, types, profile = state.profile) {
    if (!profileComplete(profile)) return null;
    let bal = 0, training = 0;
    planArr.forEach((b, i) => { const t = computeTarget(b || 0, !!types[i], profile); bal += t.effAdj; if (t.dayType === 'training') training++; });
    return { kcal: bal, kg: bal / KCAL_PER_KG, training, rest: 7 - training };
  }
  function balanceText(b, pt = false) {
    if (pt && b) {
      const kg = Math.abs(b.kg);
      return `${b.training} dia${b.training === 1 ? '' : 's'} de treino, ${b.rest} de descanso · balanço semanal ${Math.round(b.kcal) === 0 ? 'neutro' : (b.kcal > 0 ? '+' : '−') + fmtPT(Math.abs(Math.round(eVal(b.kcal)))) + ' ' + eUnit()}${Math.abs(b.kcal) < 50 ? '' : ` (≈ ${b.kcal < 0 ? '−' : '+'}${kg.toLocaleString('pt-PT', { maximumFractionDigits: 2 })} kg por semana)`}`;
    }
    if (!b) return 'Complete your profile in Settings to see calorie limits.';
    const kgAbs = Math.abs(b.kg);
    const amount = imperial() ? `${fmtNum(round(kgAbs * 2.20462, 2), 2)} lb` : `${fmtNum(round(kgAbs, 2), 2)} kg`;
    const bal = Math.abs(b.kcal) < 50 ? 'about even' : `${signedE(b.kcal)} (≈ ${b.kcal < 0 ? '−' : '+'}${amount} a week)`;
    return `${b.training} training day${b.training === 1 ? '' : 's'}, ${b.rest} rest day${b.rest === 1 ? '' : 's'} · weekly balance ${bal}`;
  }

  function weekDays(start) {
    const t = todayKey();
    return Array.from({ length: 7 }, (_, i) => {
      const key = addDays(start, i);
      const tot = dayTotals(key);
      const tg = targetFor(key);
      const act = activityTotals(key);
      return { key, label: WEEKDAYS[i], intake: tot.known ? tot.kcal : 0, logged: tot.known > 0, totals: tot, target: tg ? tg.total : null, act, isToday: key === t, future: key > t };
    });
  }
  function weekSummary(start) {
    const days = weekDays(start);
    const logged = days.filter(d => d.logged);
    const targets = days.filter(d => d.target != null && !d.future);
    const avg = (arr, fn) => arr.length ? arr.reduce((s, d) => s + fn(d), 0) / arr.length : null;
    return {
      days,
      loggedDays: logged.length,
      avgIntake: avg(logged, d => d.intake),
      avgTarget: avg(targets, d => d.target),
      avgProtein: avg(logged, d => d.totals.p),
      avgFiber: avg(logged, d => d.totals.fib),
      minutes: days.reduce((s, d) => s + d.act.minutes, 0),
      burned: days.reduce((s, d) => s + d.act.kcal, 0),
      sessions: days.reduce((s, d) => s + d.act.count, 0),
      activeDays: days.filter(d => d.act.minutes > 0).length
    };
  }

  function estimateActivityKcal(typeKey, minutes) {
    const t = ACTIVITY_MAP[typeKey];
    const w = state.profile.weightKg;
    if (!t || t.met == null || !w || !(minutes > 0)) return null;
    // Net energy above rest, so resting energy isn't counted twice.
    return Math.round((t.met - 1) * w * (minutes / 60));
  }

  /* Energy and unit formatting */
  const eUnit = () => state.settings.energy === 'kj' ? 'kJ' : 'kcal';
  const eVal = (kcal) => state.settings.energy === 'kj' ? kcal * KJ_PER_KCAL : kcal;
  const eToKcal = (v) => state.settings.energy === 'kj' ? v / KJ_PER_KCAL : v;
  const E = (kcal, withUnit = true) => kcal == null || !Number.isFinite(kcal) ? '—' : fmtNum(Math.round(eVal(kcal))) + (withUnit ? ' ' + eUnit() : '');
  const G = (v) => v == null || !Number.isFinite(v) ? '—' : fmtNum(v < 10 ? round(v, 1) : Math.round(v), 1) + ' g';
  const imperial = () => state.settings.units === 'imperial';
  function weightText(kg) { return kg == null ? '—' : imperial() ? `${fmtNum(round(kg * 2.20462, 1), 1)} lb` : `${fmtNum(round(kg, 1), 1)} kg`; }
  function heightText(cm) {
    if (cm == null) return '—';
    if (!imperial()) return `${fmtNum(round(cm))} cm`;
    const inches = cm / 2.54; const ft = Math.floor(inches / 12); return `${ft} ft ${fmtNum(round(inches - ft * 12))} in`;
  }
  function qtyText(e) {
    const u = UNIT_MAP[e.unit] || UNIT_MAP.g;
    if (e.unit === 'g' || e.unit === 'ml') return `${fmtNum(e.qty, 1)} ${u.one}`;
    return plural(e.qty, u.one, u.many);
  }

  /* =========================================================
     6. UI infrastructure
     ========================================================= */
  const main = () => $('#main');

  // ---- Toasts ----
  function toast(message, { action, onAction, error = false, timeout = 4500 } = {}) {
    const box = $('#toasts');
    const el = document.createElement('div');
    el.className = 'toast' + (error ? ' error' : '');
    el.setAttribute('role', error ? 'alert' : 'status');
    el.innerHTML = `<span class="grow">${esc(message)}</span>${action ? `<button type="button">${esc(action)}</button>` : ''}`;
    const remove = () => { el.style.transition = 'opacity .2s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 220); };
    if (action) el.querySelector('button').addEventListener('click', () => { remove(); onAction && onAction(); });
    box.appendChild(el);
    while (box.children.length > 3) box.firstElementChild.remove();
    setTimeout(remove, timeout);
  }

  // ---- Modals (stack, focus trap, Escape, bottom sheet on phones) ----
  const modalStack = [];
  let modalSeq = 0;
  function openModal({ title, body, foot = '', wide = false, onMount, onClose, initialFocus }) {
    const id = 'modal-title-' + (++modalSeq);
    const root = document.createElement('div');
    root.className = 'modal-root';
    root.innerHTML = `
      <div class="modal-backdrop" data-close></div>
      <div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="${id}" tabindex="-1">
        <div class="grabber" aria-hidden="true"></div>
        <div class="modal-head"><h2 id="${id}">${esc(title)}</h2>
          <button type="button" class="icon-btn" data-close aria-label="Close">${icon('x')}</button></div>
        <div class="modal-body">${body}</div>
        ${foot ? `<div class="modal-foot">${foot}</div>` : ''}
      </div>`;
    $('#modals').appendChild(root);
    const opener = document.activeElement;
    const m = { root, opener, closed: false, onClose };
    m.close = () => {
      if (m.closed) return;
      m.closed = true;
      const i = modalStack.indexOf(m);
      if (i >= 0) modalStack.splice(i, 1);
      root.classList.add('closing');
      setTimeout(() => root.remove(), 230);
      if (!modalStack.length) {
        $('#app').inert = false;
        document.body.style.overflow = '';
      }
      if (opener && document.contains(opener) && typeof opener.focus === 'function') opener.focus({ preventScroll: true });
      if (onClose) onClose();
    };
    root.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) { e.preventDefault(); m.close(); } });
    modalStack.push(m);
    $('#app').inert = true;
    document.body.style.overflow = 'hidden';
    if (onMount) onMount(root, m);
    requestAnimationFrame(() => {
      // On phones, focus the sheet itself so the keyboard doesn't pop up uninvited.
      let target = isMobile() ? $('.modal', root) : (initialFocus ? $(initialFocus, root) : null);

      if (target) target.focus({ preventScroll: true });
    });
    return m;
  }
  const closeTopModal = () => { const m = modalStack[modalStack.length - 1]; if (m) m.close(); };
  const closeAllModals = () => { while (modalStack.length) modalStack[modalStack.length - 1].close(); };

  function confirmDialog({ title, message, confirmLabel = 'Delete', danger = true }) {
    return new Promise((resolve) => {
      let done = false;
      const m = openModal({
        title,
        body: `<p class="muted">${esc(message)}</p>`,
        foot: `<button type="button" class="btn btn-outline" data-close>Cancel</button>
               <button type="button" class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-confirm>${esc(confirmLabel)}</button>`,
        initialFocus: '[data-confirm]',
        onClose: () => { if (!done) { done = true; resolve(false); } },
        onMount: (root) => {

        }

    });
  }

  document.addEventListener('keydown', (e) => {
    if (!modalStack.length) return;

    if (e.key === 'Tab') {
      const focusables = $$('a[href], button:not([disabled]), input:not([disabled]):not([type=hidden]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])', top.root)

  });

  // ---- Theme ----

  // ---- Router (plain #name hashes) ----

    assistant: { title: 'Assistant', render: renderAssistant },
    meals: { title: 'Meals', render: renderMeals },
    foods: { title: 'Foods', render: renderFoods },

  const currentView = () => { const h = (location.hash || '').replace(/^#/, ''); return VIEWS[h] ? h : 'today'; };

  function updateSaveNote() {

  /* =========================================================

  function ringSVG({ value, max, size = 172, stroke = 15, over = false, big, cap }) {
    const r = (size - stroke) / 2;

    const off = C * (1 - pct);

  function entryRow(e, { showDate = false, actions = true } = {}) {
