      <button type="button" class="grow" data-action="edit-entry" data-id="${e.id}" style="background:none;border:0;padding:0;text-align:left;cursor:pointer;min-width:0" aria-label="Edit ${esc(e.name)}">
        <span class="title">${esc(e.name)}</span>
        <span class="meta">${metaBits.join(' · ')}</span>
      </button>
      <span class="value num" ${n.known ? '' : 'title="Nutrition not calculated"'}>${n.known ? E(n.kcal) : '<span class="subtle">—</span>'}</span>
      ${actions ? `<span class="entry-actions">
        <button type="button" class="icon-btn" data-action="edit-entry" data-id="${e.id}" aria-label="Edit ${esc(e.name)}">${icon('edit', 'icon-sm')}</button>
        <button type="button" class="icon-btn danger" data-action="delete-entry" data-id="${e.id}" aria-label="Delete ${esc(e.name)}">${icon('trash', 'icon-sm')}</button>
      </span>` : ''}
    </li>`;
  }
  function activityRow(a, { showDate = false, actions = true } = {}) {
    const meta = [];
    if (showDate) meta.push(relDay(a.date));
    meta.push(`${fmtNum(a.duration)} min`);
    if (a.notes) meta.push(esc(a.notes));
    return `<li class="list-item">
      <span class="leading activity" aria-hidden="true">${icon('activity')}</span>
      <button type="button" class="grow" data-action="edit-activity" data-id="${a.id}" style="background:none;border:0;padding:0;text-align:left;cursor:pointer;min-width:0" aria-label="Edit ${esc(a.name)}">
        <span class="title">${esc(a.name)}</span><span class="meta">${meta.join(' · ')}</span>
      </button>
      <span class="value num">${a.kcal ? E(a.kcal) : '<span class="subtle">—</span>'}</span>
      ${actions ? `<span class="entry-actions">
        <button type="button" class="icon-btn danger" data-action="delete-activity" data-id="${a.id}" aria-label="Delete ${esc(a.name)}">${icon('trash', 'icon-sm')}</button>
      </span>` : ''}
    </li>`;
  }
  function macroRows(tot, { proteinRef = proteinReference(), compact = false } = {}) {
    const energyFromMacros = tot.p * 4 + tot.c * 4 + tot.f * 9;
    const pctE = (v) => energyFromMacros > 0 ? Math.round(v / energyFromMacros * 100) : 0;
    const rows = [
      { name: 'Protein', color: 'var(--protein)', val: tot.p, mult: 4, ref: proteinRef, sub: proteinRef ? `of ${fmtNum(Math.round(proteinRef))} g` : `${pctE(tot.p * 4)}% of energy` },
      { name: 'Carbs', color: 'var(--carbs)', val: tot.c, mult: 4, ref: null, sub: `${pctE(tot.c * 4)}% of energy` },
      { name: 'Fat', color: 'var(--fat)', val: tot.f, mult: 9, ref: null, sub: `${pctE(tot.f * 9)}% of energy` },
      { name: 'Fiber', color: 'var(--fiber)', val: tot.fib, mult: 2, ref: fiberReference(), sub: `of ${fiberReference()} g` }
    ];
    return rows.map(r => {
      const pct = r.ref ? r.val / r.ref * 100 : pctE(r.val * r.mult);
      return `<div class="macro-row">
        <span class="name"><span class="dot" style="background:${r.color}"></span>${r.name}</span>
        ${barHTML(pct, r.color)}
        <span class="amt"><strong style="color:var(--text)">${G(r.val)}</strong>${compact ? '' : ` <span class="subtle">${r.sub}</span>`}</span>
      </div>`;
    }).join('');
  }

  /* =========================================================
     7. Views
     ========================================================= */

  // ---------- Dashboard ----------
  function renderDashboard() {
    const t = todayKey();
    const tot = dayTotals(t);
    const tg = targetFor(t);
    const act = activityTotals(t);
    const week = weekSummary(weekStartOf(t));
    const name = state.profile.name ? `, ${esc(state.profile.name)}` : '';

    let hero;
    if (tg) {
      const remaining = tg.total - tot.kcal;
      const over = remaining < 0;
      hero = `
        ${tg.teen ? ringSVG({ value: tot.kcal, max: tg.total, big: E(tot.kcal, false), cap: `of ${E(tg.total)}` })
          : ringSVG({ value: tot.kcal, max: tg.total, over, big: E(Math.abs(remaining), false), cap: `${eUnit()} ${over ? 'over' : 'left'}` })}
        <div class="stack" style="gap:14px;min-width:0">
          <div><h2>Energy today</h2><p class="small muted">${tg.dayType === 'training' ? 'Training day' : 'Rest day'} in your weekly plan · ${LW()} adjusts to each day.</p></div>
          <div class="hero-stats">
            <div class="stat"><div class="label"><span class="dot" style="background:var(--accent-strong)"></span>Eaten</div><div class="value">${E(tot.kcal, false)}<small>${eUnit()}</small></div></div>
            <div class="stat"><div class="label"><span class="dot" style="background:var(--text-3)"></span>${tg.teen ? 'Target' : 'Limit'}</div><div class="value">${E(tg.total, false)}<small>${eUnit()}</small></div></div>
            <div class="stat"><div class="label"><span class="dot" style="background:var(--activity)"></span>Activity</div><div class="value">${E(tg.exercise, false)}<small>${eUnit()}</small></div></div>
          </div>
          <div class="breakdown" aria-label="How today's limit is calculated">
            ${dayTypeChip(tg.dayType)}
            <span class="chip" title="${tg.teen ? 'Energy needs for your age, including growth' : 'Resting energy × daily-life factor'}, plus ${tg.source === 'logged' ? 'logged' : 'planned'} exercise">${tg.teen ? 'Energy needs' : 'Maintenance'} ${E(tg.maintenance)}</span>
            <span class="chip accent">${tg.effAdj ? `${signedE(tg.effAdj)} ${tg.dayType} day` : tg.teen ? 'No decrease under 18' : 'Eat at maintenance'}</span>
            ${tg.floored ? `<span class="chip warn">Held at ${E(tg.floor)} minimum</span>` : ''}
          </div>
          ${tot.unknown ? `<p class="note">${icon('info', 'icon-sm')}<span>${tot.unknown} item${tot.unknown > 1 ? 's' : ''} without nutrition data ${tot.unknown > 1 ? 'aren’t' : 'isn’t'} counted.</span></p>` : ''}
        </div>`;
    } else {
      hero = `
        ${ringSVG({ value: 0, max: 1, big: E(tot.kcal, false), cap: `${eUnit()} eaten` })}
        <div class="stack" style="min-width:0">
          <h2>Get your daily calorie limits</h2>
          <p class="muted">Tell Nourish your goal, sex, age, height and weight. It then sets a limit for each day: lower on rest days, higher on training days.</p>
          <div class="row wrap"><button type="button" class="btn btn-primary" data-action="goto" data-view="preferences" data-section="profile-card">${icon('user')} Set up profile</button><button type="button" class="btn btn-outline" data-action="goto" data-view="activity" data-section="weekly-plan">${icon('calendar')} Weekly calorie plan</button></div>
        </div>`;
    }

    const mealTiles = MEALS.map(m => {
      const items = entriesFor(t).filter(e => e.meal === m.key);
      const s = sumNutrition(items);
      return `<button type="button" class="meal-tile${items.length ? ' done' : ''}" data-action="add-entry" data-meal="${m.key}" data-date="${t}"
          aria-label="Add food to ${m.label}. ${items.length ? `${items.length} items, ${E(s.kcal)}` : 'Nothing logged yet'}">
        <span class="row" style="justify-content:space-between"><span class="mt-icon">${icon(m.icon)}</span>${items.length ? icon('check', 'icon-sm') : icon('plus', 'icon-sm')}</span>
        <span class="mt-name">${m.label}</span>
        <span class="mt-meta num">${items.length ? `${items.length} item${items.length > 1 ? 's' : ''} · ${E(s.kcal)}` : 'Not logged yet'}</span>
      </button>`;
    }).join('');

    const todayActs = activitiesFor(t);
    const recent = [
      ...state.entries.map(e => ({ kind: 'entry', ts: e.updatedAt || e.createdAt || 0, item: e })),
      ...state.activities.map(a => ({ kind: 'activity', ts: a.updatedAt || a.createdAt || 0, item: a }))
    ].sort((a, b) => b.ts - a.ts).slice(0, 7);

    return `
      <header class="view-header">
        <div><div class="eyebrow">${esc(longDate(t))}</div><h1 tabindex="-1">${greeting()}${name}</h1><p class="sub">Here's your day at a glance.</p></div>
        <div class="header-actions">
          <button type="button" class="btn btn-outline" data-action="add-activity" data-date="${t}">${icon('activity')} Log activity</button>
          <button type="button" class="btn btn-primary" data-action="add-entry" data-date="${t}">${icon('plus')} Add food</button>
        </div>
      </header>
      ${banners()}
      <section class="dash-grid" aria-label="Daily overview">
        <div class="card dash-hero">${hero}</div>
        <div class="card dash-macros">
          <div class="card-header"><h2>Nutrients</h2><span class="small subtle">Today</span></div>
          ${macroRows(tot)}
          <p class="note" style="margin-top:14px">${icon('info', 'icon-sm')}<span>${isTeen() ? `Protein: ${TEEN_PROTEIN_G_PER_KG} g per kg of body weight. Fiber: ${fiberReference()} g a day (EFSA, teens). Growing bodies need regular meals and enough energy.` : `Protein target: ${goalOf().proteinPerKg} g per kg of body weight for “${esc(goalOf().label)}”. Fiber: ${FIBER_REFERENCE_G} g a day (EFSA, adults).`}</span></p>
        </div>
        <div class="card dash-meals">
          <div class="card-header"><h2>Meals</h2><a class="card-link" href="#meals">Open meals ${icon('chevron-right', 'icon-sm')}</a></div>
          <div class="meal-tiles">${mealTiles}</div>
          ${mealSummary(t)}
        </div>
        <div class="card dash-activity">
          <div class="card-header"><h2>Activity</h2><a class="card-link" href="#activity">This week ${icon('chevron-right', 'icon-sm')}</a></div>
          <div class="grid grid-2" style="gap:12px;margin-bottom:14px">
            <div class="stat"><div class="label">${icon('clock', 'icon-sm')} Today</div><div class="value">${fmtNum(act.minutes)}<small>min</small></div></div>
            <div class="stat"><div class="label">${icon('flame', 'icon-sm')} Burned</div><div class="value">${E(act.kcal, false)}<small>${eUnit()}</small></div></div>
          </div>
          <div class="row small" style="justify-content:space-between;margin-bottom:6px"><span class="muted">Weekly active minutes</span><span class="num"><strong>${fmtNum(week.minutes)}</strong> / ${WEEKLY_ACTIVE_MINUTES}</span></div>
          ${barHTML(week.minutes / WEEKLY_ACTIVE_MINUTES * 100, 'var(--activity)')}
          ${todayActs.length ? `<ul class="list" style="margin-top:8px">${todayActs.map(a => activityRow(a)).join('')}</ul>`
            : `<div class="row" style="margin-top:14px"><button type="button" class="btn btn-sm btn-outline" data-action="add-activity" data-date="${t}">${icon('plus', 'icon-sm')} Log today's activity</button></div>`}
        </div>
        <div class="card dash-quick">
          <div class="card-header"><h2>Quick access</h2></div>
          <div class="quick-grid">
            <button type="button" class="quick" data-action="add-entry" data-date="${t}"><span class="q-icon">${icon('plus')}</span>Add food<span class="q-sub">Log a meal item</span></button>
            <button type="button" class="quick" data-action="snap-meal" data-date="${t}"><span class="q-icon">${icon('camera')}</span>Snap a meal<span class="q-sub">Photo journal</span></button>
            <button type="button" class="quick" data-action="add-activity" data-date="${t}"><span class="q-icon">${icon('activity')}</span>Log activity<span class="q-sub">Duration and energy</span></button>
            <button type="button" class="quick" data-action="goto" data-view="assistant"><span class="q-icon">${icon('sparkle')}</span>Assistant<span class="q-sub">Help and app settings</span></button>
            <button type="button" class="quick" data-action="goto" data-view="foods"><span class="q-icon">${icon('book')}</span>Foods<span class="q-sub">${FOOD_DB.length + state.customFoods.length} foods</span></button>
            <button type="button" class="quick" data-action="goto" data-view="history"><span class="q-icon">${icon('trend')}</span>History<span class="q-sub">Weekly trends</span></button>
          </div>
        </div>
        <div class="card dash-week">
          <div class="card-header"><h2>This week</h2><a class="card-link" href="#history">Trends ${icon('chevron-right', 'icon-sm')}</a></div>
          <div class="chart-box" data-chart="week" data-start="${weekStartOf(t)}"></div>
          <div class="legend" style="margin-top:8px"><span><i class="sw" style="background:var(--accent)"></i>Eaten</span>${isTeen() ? '' : '<span><i class="sw" style="background:var(--warn)"></i>Over target</span>'}<span><i class="sw line"></i>Target</span></div>
        </div>
        <div class="card dash-recent">
          <div class="card-header"><h2>Recent</h2><a class="card-link" href="#history">History ${icon('chevron-right', 'icon-sm')}</a></div>
          ${recent.length ? `<ul class="list">${recent.map(r => r.kind === 'entry' ? entryRow(r.item, { showDate: true, actions: false }) : activityRow(r.item, { showDate: true, actions: false })).join('')}</ul>`
            : emptyState('clock', 'Nothing logged yet', 'Your latest meals and activities will appear here.', '', true)}
        </div>
      </section>`;
  }

  /** What was eaten today, in one line per meal. */
  function mealSummary(date) {
    const rows = MEALS.map(m => {
      const list = entriesFor(date).filter(e => e.meal === m.key);
      if (!list.length) return '';
      return `<li><span class="ms-meal">${m.label}</span><span class="ms-foods">${list.map(e => esc(e.name.split(',')[0])).join(', ')}</span></li>`;
    }).join('');
    return rows ? `<ul class="meal-summary" aria-label="Foods logged today">${rows}</ul>` : '';
  }

  // ---------- Meals ----------
  function renderMeals() {
    const d = ui.mealsDate;
    const tot = dayTotals(d);
    const tg = targetFor(d);
    const items = entriesFor(d);
    const pRef = proteinReference();
    const sections = MEALS.map(m => {
      const list = items.filter(e => e.meal === m.key);
      const s = sumNutrition(list);
      return `<section class="card meal-section" aria-labelledby="meal-${m.key}">
        <div class="card-header">
          <div class="card-title-icon"><span class="bubble">${icon(m.icon)}</span><div><h2 id="meal-${m.key}">${m.label}</h2>
          <div class="totals">${list.length ? `${E(s.kcal)} · P ${G(s.p)} · C ${G(s.c)} · F ${G(s.f)}` : 'Nothing logged'}</div></div></div>
          <div class="row" style="gap:4px">
            <button type="button" class="icon-btn" data-action="snap-meal" data-meal="${m.key}" data-date="${d}" aria-label="Add a photo to ${m.label}">${icon('camera')}</button>
            <button type="button" class="icon-btn filled" data-action="add-entry" data-meal="${m.key}" data-date="${d}" aria-label="Add food to ${m.label}">${icon('plus')}</button>
          </div>
        </div>
        ${list.length ? `<ul class="list">${list.map(e => entryRow(e)).join('')}</ul>`
          : `<button type="button" class="btn btn-ghost btn-block" data-action="add-entry" data-meal="${m.key}" data-date="${d}" style="justify-content:flex-start;margin-top:6px">${icon('plus')} Add food to ${m.label.toLowerCase()}</button>`}
      </section>`;
    }).join('');

    return `
      <header class="view-header">
        <div><div class="eyebrow">Meal tracking</div><h1 tabindex="-1">${esc(relDay(d))}</h1><p class="sub">${esc(longDate(d))}</p></div>
        <div class="header-actions">${dateNav('meals', d)}</div>
      </header>
      ${state.meta.demoActive ? banners() : ''}
      <section class="summary-strip" aria-label="Day totals">
        <div class="card"><div class="stat"><div class="label">${icon('bowl', 'icon-sm')} Eaten</div><div class="value">${E(tot.kcal, false)}<small>${eUnit()}</small></div></div></div>
        <div class="card"><div class="stat"><div class="label">${icon('target', 'icon-sm')} ${tg ? (tg.teen ? 'Energy target' : tg.total - tot.kcal >= 0 ? 'Remaining' : 'Over target') : 'Target'}</div>
          <div class="value">${tg ? (tg.teen ? `${E(tg.total, false)}<small>${eUnit()}</small>` : `${E(Math.abs(tg.total - tot.kcal), false)}<small>of ${E(tg.total)}</small>`) : `<a href="#preferences" class="small" style="font-weight:600">Set up profile</a>`}</div></div></div>
        <div class="card"><div class="stat"><div class="label"><span class="dot" style="background:var(--protein)"></span>Protein</div><div class="value">${fmtNum(Math.round(tot.p))}<small>${pRef ? `/ ${fmtNum(Math.round(pRef))} g` : 'g'}</small></div></div></div>
        <div class="card"><div class="stat"><div class="label"><span class="dot" style="background:var(--fiber)"></span>Fiber</div><div class="value">${fmtNum(round(tot.fib, 1), 1)}<small>/ ${fiberReference()} g</small></div></div></div>
      </section>
      <div class="meal-sections">${sections}</div>
      <p class="note">${icon('info', 'icon-sm')}<span>Nutrition is calculated from encyclopedia values when the amount can be converted to grams. Items marked — have no reliable data yet: edit them to add a weight or a known energy value.</span></p>`;
  }

  // ---------- Foods ----------
  function renderFoods() {
    const cats = [{ key: 'all', label: 'All' }, ...FOOD_CATEGORIES, { key: 'custom', label: `My foods (${state.customFoods.length})` }];
    return `
      <header class="view-header">
        <div><div class="eyebrow">Food encyclopedia</div><h1 tabindex="-1">Foods</h1><p class="sub">${FOOD_DB.length + state.customFoods.length} foods · nutrition per 100 g and common serving sizes</p></div>
        <div class="header-actions"><button type="button" class="btn btn-primary" data-action="add-custom-food">${icon('plus')} Add custom food</button></div>
      </header>
      <div class="food-toolbar">
        <div class="search">${icon('search')}<label for="food-search" class="sr-only">Search foods</label>
          <input id="food-search" class="input" type="search" placeholder="Search in English or Portuguese, e.g. oats, arroz, salmon" value="${esc(ui.foodQuery)}" autocomplete="off"></div>
        <div class="chips" id="food-chips" role="group" aria-label="Filter by category">
          ${cats.map(c => `<button type="button" class="chip" data-action="food-cat" data-cat="${c.key}" aria-pressed="${ui.foodCat === c.key}">${esc(c.label)}</button>`).join('')}
        </div>
      </div>
      <div id="food-results" aria-live="polite">${foodResultsHTML()}</div>
      <p class="note">${icon('info', 'icon-sm')}<span>Values are rounded averages from USDA FoodData Central reference data. Brands, varieties and cooking methods vary, so treat them as estimates.</span></p>`;
  }
  function foodCard(f) {
    const pe = f.p * 4, ce = f.c * 4, fe = f.f * 9, tot = pe + ce + fe || 1;
    return `<button type="button" class="food-card" data-action="open-food" data-id="${esc(f.id)}" aria-label="${esc(f.name)}, ${E(f.kcal)} per 100 grams">
      <span class="fc-top"><span style="min-width:0;display:block"><span class="fc-name">${esc(f.name)}</span><span class="xsmall subtle" style="display:block">${esc(catLabel(f.cat))}${f.custom ? ' · My food' : ''}</span></span>
        <span class="fc-kcal">${E(f.kcal, false)} <small>${eUnit()}</small></span></span>
      <span class="macro-stack" aria-hidden="true"><span style="width:${pe / tot * 100}%;background:var(--protein)"></span><span style="width:${ce / tot * 100}%;background:var(--carbs)"></span><span style="width:${fe / tot * 100}%;background:var(--fat)"></span></span>
      <span class="macro-legend"><span><i class="dot" style="background:var(--protein)"></i>P ${G(f.p)}</span><span><i class="dot" style="background:var(--carbs)"></i>C ${G(f.c)}</span><span><i class="dot" style="background:var(--fat)"></i>F ${G(f.f)}</span><span><i class="dot" style="background:var(--fiber)"></i>Fiber ${G(f.fib)}</span></span>
    </button>`;
  }
  function foodResultsHTML() {
    const results = searchFoods(ui.foodQuery, ui.foodCat);
    if (!results.length) {
      return emptyState('search', ui.foodCat === 'custom' && !ui.foodQuery ? 'No custom foods yet' : 'No foods found',
        ui.foodCat === 'custom' && !ui.foodQuery ? 'Add foods you eat often, with values from the package label.' : 'Try another word, or add it as a custom food.',
        `<button type="button" class="btn btn-primary btn-sm" data-action="add-custom-food">${icon('plus', 'icon-sm')} Add custom food</button>`);
    }
    if (!ui.foodQuery && ui.foodCat === 'all') {
      const groups = [...FOOD_CATEGORIES.map(c => ({ key: c.key, label: c.label, items: results.filter(f => f.cat === c.key && !f.custom) })),
        { key: 'custom', label: 'My foods', items: results.filter(f => f.custom) }].filter(g => g.items.length);
      return groups.map(g => `<section style="margin-bottom:22px" aria-label="${esc(g.label)}"><h3 style="margin:0 0 10px">${esc(g.label)} <span class="subtle small">${g.items.length}</span></h3><div class="food-grid">${g.items.map(foodCard).join('')}</div></section>`).join('');
    }
    return `<p class="small muted" style="margin-bottom:10px">${results.length} result${results.length === 1 ? '' : 's'}</p><div class="food-grid">${results.map(foodCard).join('')}</div>`;
  }
  function updateFoodResults() { const box = $('#food-results'); if (box) { box.innerHTML = foodResultsHTML(); } }
  function updateFoodChips() { $$('#food-chips .chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.cat === ui.foodCat))); }

  // ---------- Journal ----------
  function journalEntries() {
    const q = normalize(ui.journalQuery).trim();
    return state.entries.filter(e => e.photoId)
      .filter(e => ui.journalMeal === 'all' || e.meal === ui.journalMeal)
      .filter(e => !q || normalize(`${e.name} ${e.photoDesc} ${e.notes}`).includes(q))
      .sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));
  }
  function journalResultsHTML() {
    const list = journalEntries();
    const totalPhotos = state.entries.filter(e => e.photoId).length;
    if (!list.length) {
      return totalPhotos
        ? emptyState('search', 'No photos match', 'Try another search or meal filter.')
        : emptyState('camera', 'No meal photos yet', 'Take a photo or upload one, then describe what’s on the plate.',
          `<button type="button" class="btn btn-primary" data-action="snap-meal">${icon('camera')} Add a meal photo</button>`);
    }
    return `<div class="journal-grid">${list.map(e => {
      const src = Store.getPhoto(e.photoId);
      return `<button type="button" class="card photo-card" data-action="open-photo" data-id="${e.id}" aria-label="Open photo: ${esc(e.name)}, ${esc(relDay(e.date))}">
        ${src ? `<img src="${src}" alt="" loading="lazy">` : `<span style="aspect-ratio:4/3;display:grid;place-items:center;background:var(--surface-2)">${icon('image', 'icon-lg')}</span>`}
        <span class="pc-body"><span class="xsmall subtle">${esc(relDay(e.date))} · ${MEAL_MAP[e.meal].label}</span>
          <span style="font-weight:650">${esc(e.name)}</span>
          ${e.photoDesc ? `<span class="pc-desc">${esc(e.photoDesc)}</span>` : '<span class="pc-desc subtle">No description</span>'}</span>
      </button>`;
    }).join('')}</div>`;
  }
  function renderJournal() {
    const count = state.entries.filter(e => e.photoId).length;
    const chips = [{ key: 'all', label: 'All meals' }, ...MEALS];
    return `
      <header class="view-header">
        <div><div class="eyebrow">Food photo journal</div><h1 tabindex="-1">Journal</h1><p class="sub">${count} photo${count === 1 ? '' : 's'} · a visual diary of what you eat</p></div>
        <div class="header-actions"><button type="button" class="btn btn-primary" data-action="snap-meal">${icon('camera')} Add photo</button></div>
      </header>
      <div class="banner">${icon('info')}<div class="grow small">Photos are a visual record only. They can't measure portions or nutrients, so add the food and amount to an entry when you want numbers.</div></div>
      <div class="food-toolbar">
        <div class="search">${icon('search')}<label for="journal-search" class="sr-only">Search photo descriptions</label>
          <input id="journal-search" class="input" type="search" placeholder="Search descriptions and notes" value="${esc(ui.journalQuery)}" autocomplete="off"></div>
        <div class="chips" id="journal-chips" role="group" aria-label="Filter by meal">
          ${chips.map(c => `<button type="button" class="chip" data-action="journal-meal" data-meal="${c.key}" aria-pressed="${ui.journalMeal === c.key}">${c.label}</button>`).join('')}
        </div>
      </div>
      <div id="journal-results" aria-live="polite">${journalResultsHTML()}</div>
      <p class="note">${icon('info', 'icon-sm')}<span>Photos are resized and stored in this browser, which holds about ${STORAGE_QUOTA_MB} MB in total. Settings shows how much is used.</span></p>`;
  }

  // ---------- Activity ----------
  function renderActivity() {
    const ws = ui.activityWeek;
    const sum = weekSummary(ws);
    const t = todayKey();
    const minutesPct = sum.minutes / WEEKLY_ACTIVE_MINUTES * 100;
    const dayCards = sum.days.map((d, i) => {
      const list = activitiesFor(d.key);
      const tgDay = targetFor(d.key);
      return `<section class="card day-card${d.isToday ? ' today' : ''}" aria-labelledby="day-${d.key}">
        <div class="dc-head"><div><div class="dc-day" id="day-${d.key}">${WEEKDAYS_LONG[i]}</div><div class="dc-date">${esc(shortDate(d.key))}${d.isToday ? ' · Today' : ''}</div></div>
          <button type="button" class="icon-btn filled" data-action="add-activity" data-date="${d.key}" aria-label="Add activity on ${WEEKDAYS_LONG[i]}, ${esc(shortDate(d.key))}">${icon('plus', 'icon-sm')}</button></div>
        <div class="dc-items">
          ${list.length ? list.map(a => `<button type="button" class="act-pill" data-action="edit-activity" data-id="${a.id}" aria-label="Edit ${esc(a.name)}, ${fmtNum(a.duration)} minutes">
              <span class="ap-name">${esc(a.name)}</span><span class="ap-meta">${fmtNum(a.duration)} min${a.kcal ? ` · ${E(a.kcal)}` : ''}</span></button>`).join('')
            : `<span class="xsmall subtle">${d.future ? 'Planned day' : 'Rest day'}</span>`}
        </div>
        <div class="dc-foot"><span>${d.act.minutes ? `${fmtNum(d.act.minutes)} min` : '—'}</span><span title="${tgDay ? `${tgDay.dayType === 'training' ? 'Training' : 'Rest'} day calorie limit` : 'Planned exercise burn'}">${tgDay ? `${tgDay.dayType === 'training' ? 'Training' : 'Rest'} · ${E(tgDay.total)}` : `Plan ${state.weeklyPlan[i] ? E(state.weeklyPlan[i]) : '—'}`}</span></div>
      </section>`;
    }).join('');


    return `
      <header class="view-header">
        <div><div class="eyebrow">Weekly activity</div><h1 tabindex="-1">Activity</h1><p class="sub">${esc(weekRangeLabel(ws))}</p></div>
        <div class="header-actions">${weekNav('activity', ws)}
          <button type="button" class="btn btn-primary" data-action="add-activity" data-date="${ws <= t && t <= addDays(ws, 6) ? t : ws}">${icon('plus')} Log activity</button></div>
      </header>
      ${state.meta.demoActive ? banners() : ''}
      <section class="summary-strip" aria-label="Week totals">
        <div class="card"><div class="stat"><div class="label">${icon('clock', 'icon-sm')} Active minutes</div><div class="value">${fmtNum(sum.minutes)}<small>/ ${WEEKLY_ACTIVE_MINUTES}</small></div></div>
          <div style="margin-top:10px">${barHTML(minutesPct, 'var(--activity)')}</div></div>
        <div class="card"><div class="stat"><div class="label">${icon('flame', 'icon-sm')} Energy burned</div><div class="value">${E(sum.burned, false)}<small>${eUnit()}</small></div></div><p class="xsmall subtle" style="margin-top:6px">Logged estimates</p></div>
        <div class="card"><div class="stat"><div class="label">${icon('calendar', 'icon-sm')} Active days</div><div class="value">${sum.activeDays}<small>/ 7</small></div></div></div>
        <div class="card"><div class="stat"><div class="label">${icon('activity', 'icon-sm')} Sessions</div><div class="value">${sum.sessions}</div></div></div>
      </section>
      <section class="week-grid" aria-label="Monday to Sunday">${dayCards}</section>
      ${weeklyPlanCard()}
      <section class="card" aria-labelledby="act-history-h">
        <div class="card-header"><h2 id="act-history-h">Weekly history</h2><span class="small subtle">Active minutes, last 8 weeks</span></div>
        <div class="chart-box" data-chart="activity-weeks" data-start="${ws}"></div>
        <div class="legend" style="margin-top:8px"><span><i class="sw" style="background:var(--activity)"></i>Minutes</span><span><i class="sw line"></i>${WEEKLY_ACTIVE_MINUTES} min (WHO minimum)</span></div>
      </section>
      <p class="note">${icon('info', 'icon-sm')}<span>Energy estimates use MET values from the Compendium of Physical Activities: (MET − 1) × body weight × hours. Real expenditure varies with fitness, intensity and terrain.</span></p>`;
  }

  /** Rest/training switch shown beside each weekday's burn estimate. */
  function dayToggleHTML(i, type) {
    const other = type === 'training' ? 'rest' : 'training';
    return `<button type="button" class="day-toggle ${type}" data-action="toggle-daytype" data-wd="${i}" data-type="${type}" aria-label="${WEEKDAYS_LONG[i]} is a ${type} day. Switch to ${other} day." title="Switch to ${other} day">
      ${icon(type === 'training' ? 'activity' : 'moon', 'icon-sm')}<span class="t-long">${type === 'training' ? 'Training day' : 'Rest day'}</span><span class="t-short">${type === 'training' ? 'Training' : 'Rest'}</span><span class="swap" aria-hidden="true">${icon('swap', 'icon-sm')}</span></button>`;
  }
  /** Monday-to-Sunday plan: estimated burn + rest/training switch → calorie limit, updated live. */
  function weeklyPlanCard({ inSettings = false } = {}) {
    const g = goalOf();
    const teen = isTeen();
    return `<section class="card" id="weekly-plan" aria-labelledby="plan-h">
      <div class="card-header" style="flex-wrap:wrap;align-items:flex-start">
        <div><h2 id="plan-h">Weekly calorie plan</h2><div class="small subtle">Rest days ${teen ? 'at your energy needs' : signedE(REST_DAY_ADJ)} · training days ${signedE(TRAINING_DAY_ADJ)} vs maintenance · goal: ${esc(g.label)}</div></div>
        ${inSettings ? '' : `<button type="button" class="card-link" data-action="goto" data-view="preferences" data-section="profile-card">Edit profile ${icon('chevron-right', 'icon-sm')}</button>`}
      </div>
      ${teen ? `<p class="note" style="margin-bottom:10px">${icon('info', 'icon-sm')}<span>Under 18: rest days stay at your energy needs, with no decrease. Training days add 200 kcal so you stay fueled.</span></p>` : ''}
      <p class="small muted" style="margin-bottom:12px">Type the exercise energy you expect to burn each day, and use the button beside it to mark the day as a rest day or a training day. Days with logged activity energy use that instead of the estimate${state.settings.useLoggedBurn ? '' : ' (turned off in Settings)'}.</p>
      <form id="plan-form" class="stack" novalidate>
        <div class="table-wrap"><table class="plan-table">
          <thead><tr><th scope="col">Day</th><th scope="col">Estimated burn <span class="d-short">(${eUnit()})</span></th><th scope="col">Rest or training</th><th scope="col" class="r">${teen ? 'Energy target' : 'Calorie limit'}</th></tr></thead>
          <tbody>${WEEKDAYS.map((w, i) => `<tr data-wd="${i}">
            <th scope="row"><span class="d-long">${WEEKDAYS_LONG[i]}</span><span class="d-short">${w}</span></th>
            <td><div class="input-suffix"><input id="plan-${i}" class="input" type="number" inputmode="numeric" min="0" max="${state.settings.energy === 'kj' ? 12550 : 3000}" step="10" value="${state.weeklyPlan[i] ? Math.round(eVal(state.weeklyPlan[i])) : ''}" placeholder="0" aria-label="Estimated burn on ${WEEKDAYS_LONG[i]}"><span class="suffix">${eUnit()}</span></div></td>
            <td>${dayToggleHTML(i, state.weeklyTraining[i] ? 'training' : 'rest')}</td><td class="r num" data-target></td></tr>`).join('')}</tbody>
        </table></div>
        <p class="small" id="plan-total" aria-live="polite"></p>
        <div class="row wrap"><button type="submit" class="btn btn-primary">Save weekly plan</button><span class="small" id="plan-dirty" style="color:var(--warn);font-weight:600" hidden>Unsaved changes</span></div>
      </form>
    </section>`;
  }
  const readPlanInputs = () => WEEKDAYS.map((_, i) => { const el = $('#plan-' + i); const v = el ? num(el.value) : null; return v != null && v > 0 ? clamp(eToKcal(v), 0, 3000) : 0; });
  const readPlanTypes = () => WEEKDAYS.map((_, i) => { const b = $(`#plan-form .day-toggle[data-wd="${i}"]`); return b ? b.dataset.type === 'training' : !!state.weeklyTraining[i]; });
  function updatePlanPreview() {
    if (!$('#plan-form')) return;
    const burns = readPlanInputs(), types = readPlanTypes();
    burns.forEach((burn, i) => {
      const row = $(`#plan-form tr[data-wd="${i}"]`);
      const t = computeTarget(burn, types[i]);
      $('[data-target]', row).innerHTML = t ? `<strong>${E(t.total)}</strong><span class="xsmall subtle" style="display:block">${t.floored ? 'held at minimum' : signedE(t.effAdj) + (t.effAdj ? '<span class="t-long"> vs maint.</span>' : '')}</span>` : '<span class="subtle">—</span>';
    });
    $('#plan-total').textContent = balanceText(planBalance(burns, types));
  }
  function markPlanDirty() { const d = $('#plan-dirty'); if (d) d.hidden = false; }

  // ---------- History ----------
  function renderHistory() {
    const d = ui.historyDate;
    const tot = dayTotals(d);
    const tg = targetFor(d);
    const items = entriesFor(d);
    const acts = activitiesFor(d);
    const ws = ui.historyWeek;
    const sum = weekSummary(ws);
    const t = todayKey();

    // 4-week consistency grid ending this week
    const gridStart = addDays(weekStartOf(t), -21);
    const cells = Array.from({ length: 28 }, (_, i) => {
      const key = addDays(gridStart, i);
      const n = state.entries.filter(e => e.date === key).length;
      const lvl = n === 0 ? '' : n <= 2 ? 'l1' : n <= 5 ? 'l2' : 'l3';
      const future = key > t;
      return `<button type="button" class="cell ${lvl}${future ? ' future' : ''}${key === d ? ' selected' : ''}" ${future ? 'disabled' : `data-action="set-history-date" data-date="${key}"`}
        aria-label="${esc(longDate(key))}: ${n} item${n === 1 ? '' : 's'} logged" style="${key === d ? 'outline:2px solid var(--text);outline-offset:1px' : ''}">${parseKey(key).getDate()}</button>`;
    }).join('');

    const dayMeals = MEALS.map(m => {
      const list = items.filter(e => e.meal === m.key);
      if (!list.length) return '';
      return `<h3 class="small muted" style="margin:14px 0 2px;text-transform:uppercase;letter-spacing:.05em">${m.label} · ${E(sumNutrition(list).kcal)}</h3><ul class="list">${list.map(e => entryRow(e)).join('')}</ul>`;
    }).join('');

    return `
      <header class="view-header">
        <div><div class="eyebrow">History</div><h1 tabindex="-1">History &amp; trends</h1><p class="sub">Look back at any day, then see how your weeks compare.</p></div>
      </header>
      <div class="grid history-top" id="history-top">
        <section class="card" id="history-day" aria-labelledby="hd-h">
          <div class="card-header" style="flex-wrap:wrap"><div><h2 id="hd-h">${esc(relDay(d))}</h2><div class="small subtle">${esc(longDate(d))}</div></div>${dateNav('history', d)}</div>
          <div class="grid grid-3" style="gap:12px">
            <div class="stat"><div class="label">Eaten</div><div class="value">${E(tot.kcal, false)}<small>${eUnit()}</small></div></div>
            <div class="stat"><div class="label">Target</div><div class="value">${tg ? E(tg.total, false) : '—'}<small>${tg ? eUnit() : ''}</small></div></div>
            <div class="stat"><div class="label">Active</div><div class="value">${fmtNum(activityTotals(d).minutes)}<small>min</small></div></div>
          </div>
          ${items.length ? `<div style="margin-top:8px">${dayMeals}</div>` : emptyState('bowl', 'No meals recorded', 'Nothing was logged for this day.', `<button type="button" class="btn btn-sm btn-outline" data-action="add-entry" data-date="${d}">${icon('plus', 'icon-sm')} Add food to this day</button>`, true)}
          ${acts.length ? `<h3 class="small muted" style="margin:16px 0 2px;text-transform:uppercase;letter-spacing:.05em">Activities</h3><ul class="list">${acts.map(a => activityRow(a)).join('')}</ul>` : ''}
          <div class="row wrap" style="margin-top:14px"><button type="button" class="btn btn-sm btn-outline" data-action="goto" data-view="meals" data-date="${d}">${icon('bowl', 'icon-sm')} Open in meal tracker</button>
          <button type="button" class="btn btn-sm btn-outline" data-action="add-activity" data-date="${d}">${icon('activity', 'icon-sm')} Add activity</button></div>
        </section>
        <section class="card" aria-labelledby="cons-h">
          <div class="card-header"><h2 id="cons-h">Last 4 weeks</h2><span class="small subtle">Items logged per day</span></div>
          <div class="consistency" role="group" aria-label="Pick a day">
            ${WEEKDAYS.map(w => `<div class="head" aria-hidden="true">${w[0]}</div>`).join('')}
            ${cells}
          </div>
          <div class="legend" style="margin-top:12px"><span><i class="sw" style="background:var(--surface-2)"></i>None</span><span><i class="sw" style="background:color-mix(in srgb,var(--accent) 30%,var(--surface-2))"></i>1–2</span><span><i class="sw" style="background:color-mix(in srgb,var(--accent) 60%,var(--surface-2))"></i>3–5</span><span><i class="sw" style="background:var(--accent-strong)"></i>6+</span></div>
        </section>
      </div>

      <section class="card" aria-labelledby="ws-h">
        <div class="card-header" style="flex-wrap:wrap"><div><h2 id="ws-h">Weekly summary</h2><div class="small subtle">${esc(weekRangeLabel(ws))}</div></div>${weekNav('history', ws)}</div>
        <div class="grid grid-4" style="gap:12px;margin-bottom:16px">
          <div class="stat"><div class="label">Avg. eaten</div><div class="value">${sum.avgIntake != null ? E(sum.avgIntake, false) : '—'}<small>${eUnit()}/day</small></div></div>
          <div class="stat"><div class="label">Avg. target</div><div class="value">${sum.avgTarget != null ? E(sum.avgTarget, false) : '—'}<small>${eUnit()}/day</small></div></div>
          <div class="stat"><div class="label">Days logged</div><div class="value">${sum.loggedDays}<small>/ 7</small></div></div>
          <div class="stat"><div class="label">Active minutes</div><div class="value">${fmtNum(sum.minutes)}<small>/ ${WEEKLY_ACTIVE_MINUTES}</small></div></div>
          <div class="stat"><div class="label">Avg. protein</div><div class="value">${sum.avgProtein != null ? fmtNum(Math.round(sum.avgProtein)) : '—'}<small>g/day</small></div></div>
          <div class="stat"><div class="label">Avg. fiber</div><div class="value">${sum.avgFiber != null ? fmtNum(round(sum.avgFiber, 1), 1) : '—'}<small>g/day</small></div></div>
          <div class="stat"><div class="label">Energy burned</div><div class="value">${E(sum.burned, false)}<small>${eUnit()}</small></div></div>
          <div class="stat"><div class="label">Sessions</div><div class="value">${sum.sessions}</div></div>
        </div>
        <div class="chart-box" data-chart="week" data-start="${ws}"></div>
        <div class="legend" style="margin-top:8px"><span><i class="sw" style="background:var(--accent)"></i>Eaten</span>${isTeen() ? '' : '<span><i class="sw" style="background:var(--warn)"></i>Over target</span>'}<span><i class="sw line"></i>Target</span></div>
      </section>

      <div class="grid grid-2">
        <section class="card" aria-labelledby="trend-h">
          <div class="card-header"><h2 id="trend-h">Energy trend</h2><span class="small subtle">Daily average, 8 weeks</span></div>
          <div class="chart-box" data-chart="trend" data-start="${ws}"></div>
          <div class="legend" style="margin-top:8px"><span><i class="sw" style="background:var(--accent-strong)"></i>Avg. eaten (logged days)</span><span><i class="sw line"></i>Avg. target</span></div>
        </section>
        <section class="card" aria-labelledby="trend-act-h">
          <div class="card-header"><h2 id="trend-act-h">Activity trend</h2><span class="small subtle">Minutes per week</span></div>
          <div class="chart-box" data-chart="activity-weeks" data-start="${ws}"></div>
          <div class="legend" style="margin-top:8px"><span><i class="sw" style="background:var(--activity)"></i>Minutes</span><span><i class="sw line"></i>${WEEKLY_ACTIVE_MINUTES} min</span></div>
        </section>
      </div>`;
  }

  // ---------- Settings ----------
  function renderSettings() {
    const p = state.profile;
    const s = state.settings;
    const usage = Store.usage();
    const usedMB = usage.total / (1024 * 1024);
    const photoCount = state.entries.filter(e => e.photoId).length;
    const imp = imperial();
    const inches = p.heightCm ? p.heightCm / 2.54 : null;
    const ft = inches != null ? Math.floor(inches / 12) : '';
    const inch = inches != null ? round(inches - ft * 12, 1) : '';
    const seg = (name, value, options) => `<div class="segmented" role="radiogroup" aria-label="${esc(name)}">${options.map(([v, l]) =>
      `<input type="radio" name="set-${name}" id="set-${name}-${v}" value="${v}" data-setting="${name}" ${value === v ? 'checked' : ''}><label for="set-${name}-${v}">${l}</label>`).join('')}</div>`;

    return `
      <header class="view-header">
        <div><div class="eyebrow">Settings</div><h1 tabindex="-1">Settings</h1><p class="sub">Your profile, preferences and data.</p></div>
      </header>
      ${banners()}
      <div class="settings-grid">
        <div class="stack" style="gap:16px">
          <section class="card" id="profile-card" aria-labelledby="profile-h">
            <div class="card-header"><div class="card-title-icon"><span class="bubble">${icon('user')}</span><h2 id="profile-h">Goal, profile and calorie limits</h2></div>${p.demo ? '<span class="chip warn">Example profile</span>' : ''}</div>
            <form id="profile-form" class="stack" novalidate>
              <div class="form-grid">
                <div class="field span-2"><label for="pf-name">Name <span class="subtle">(optional)</span></label><input id="pf-name" class="input" autocomplete="given-name" maxlength="40" value="${esc(p.name)}"></div>
                <div class="field"><label for="pf-sex">Sex</label>
                  <select id="pf-sex" class="select"><option value="">Select…</option>
                    <option value="female" ${p.sex === 'female' ? 'selected' : ''}>Female</option><option value="male" ${p.sex === 'male' ? 'selected' : ''}>Male</option>
                    <option value="unspecified" ${p.sex === 'unspecified' ? 'selected' : ''}>Prefer not to say</option></select>
                  <span class="hint">Used only in the energy formula.</span></div>
                <div class="field"><label for="pf-age">Age</label><div class="input-suffix"><input id="pf-age" class="input" type="number" inputmode="numeric" min="${MIN_AGE}" max="100" value="${p.age ?? ''}"><span class="suffix">years</span></div><span class="field-error" id="pf-age-err" hidden></span></div>
                ${imp ? `
                <div class="field"><span class="field-label" id="pf-h-lbl">Height</span><div class="row" style="gap:8px" role="group" aria-labelledby="pf-h-lbl">
                  <div class="input-suffix" style="flex:1"><input id="pf-ft" class="input" type="number" inputmode="numeric" min="3" max="7" aria-label="Feet" value="${ft}"><span class="suffix">ft</span></div>
                  <div class="input-suffix" style="flex:1"><input id="pf-in" class="input" type="number" inputmode="decimal" min="0" max="11.9" step="0.5" aria-label="Inches" value="${inch}"><span class="suffix">in</span></div></div><span class="field-error" id="pf-h-err" hidden></span></div>
                <div class="field"><label for="pf-lb">Weight</label><div class="input-suffix"><input id="pf-lb" class="input" type="number" inputmode="decimal" min="77" max="660" step="0.1" value="${p.weightKg ? round(p.weightKg * 2.20462, 1) : ''}"><span class="suffix">lb</span></div><span class="field-error" id="pf-w-err" hidden></span></div>`
                : `
                <div class="field"><label for="pf-cm">Height</label><div class="input-suffix"><input id="pf-cm" class="input" type="number" inputmode="numeric" min="120" max="230" value="${p.heightCm ?? ''}"><span class="suffix">cm</span></div><span class="field-error" id="pf-h-err" hidden></span></div>
                <div class="field"><label for="pf-kg">Weight</label><div class="input-suffix"><input id="pf-kg" class="input" type="number" inputmode="decimal" min="35" max="300" step="0.1" value="${p.weightKg ?? ''}"><span class="suffix">kg</span></div><span class="field-error" id="pf-w-err" hidden></span></div>`}
                <div class="field span-2"><label for="pf-life">Daily life, not counting workouts</label>
                  <select id="pf-life" class="select">${LIFESTYLES.map(l => `<option value="${l.key}" ${p.lifestyle === l.key ? 'selected' : ''}>${l.label} — ${l.desc}</option>`).join('')}</select>
                  <span class="hint">Workouts are added each day from your Activity log or weekly plan.</span></div>
                <div class="field span-2"><span class="field-label" id="pf-goal-lbl">What's your goal?</span>
                  <div class="goal-options" role="radiogroup" aria-labelledby="pf-goal-lbl">${GOALS.map(g => `<div class="goal-option"><input type="radio" name="pf-goal" id="pf-goal-${g.key}" value="${g.key}" ${p.goal === g.key && (p.goalChosen || p.demo) ? 'checked' : ''}><label for="pf-goal-${g.key}"><strong>${g.label}</strong><span>${g.short}</span></label></div>`).join('')}</div>
                  <span class="hint" id="pf-goal-desc">${esc(goalOf(p).desc)}</span>
                  <p class="note" id="pf-teen-note" ${isTeen(p) ? '' : 'hidden'}>${icon('info', 'icon-sm')}<span>Under 18: weight-loss goals and calorie deficits aren't available, because growing bodies need enough energy. If you're thinking about your weight, talk to a doctor, school nurse or an adult you trust.</span></p></div>
                <div class="field span-2"><p class="note">${icon('info', 'icon-sm')}<span>Your daily calories follow your weekly plan below: ${isTeen(p) ? 'rest days at your energy needs' : 'rest days 300 kcal below maintenance'}, training days 200 kcal above.</span></p></div>
              </div>
              <div class="calc-box" id="pf-calc" aria-live="polite"></div>
              <div class="row wrap"><button type="submit" class="btn btn-primary">${icon('check')} Save profile</button><span class="small subtle">Targets update across the app.</span></div>
            </form>
          </section>

          ${weeklyPlanCard({ inSettings: true })}

          <section class="card" id="prefs-card" aria-labelledby="prefs-h">
            <div class="card-header"><div class="card-title-icon"><span class="bubble">${icon('settings')}</span><h2 id="prefs-h">Preferences</h2></div></div>
            <div class="setting-row"><div class="sr-text"><div class="sr-title">Appearance</div><div class="sr-desc">System follows your device setting.</div></div>

  function readProfileForm() {
    const form = $('#profile-form');
    if (!form) return null;
    const p = Object.assign({}, state.profile);
    p.name = $('#pf-name', form).value.trim();
    p.sex = $('#pf-sex', form).value;
    p.age = num($('#pf-age', form).value);
    if (imperial()) {
      const ft = num($('#pf-ft', form).value), inch = num($('#pf-in', form).value) || 0;
      p.heightCm = ft != null ? round((ft * 12 + inch) * 2.54, 1) : null;
      const lb = num($('#pf-lb', form).value);
      p.weightKg = lb != null ? round(lb / 2.20462, 2) : null;
    } else {
      p.heightCm = num($('#pf-cm', form).value);
      p.weightKg = num($('#pf-kg', form).value);
    }
    p.lifestyle = $('#pf-life', form).value;
    const goalIn = $('input[name="pf-goal"]:checked', form);
    if (goalIn) { p.goal = goalIn.value; p.goalChosen = true; }
    return p;
  }
  function validateProfile(p) {
    const errs = {};
    if (p.age != null && (p.age < MIN_AGE || p.age > 100)) errs.age = `Enter an age from ${MIN_AGE} to 100. Nourish is for teens and adults.`;
    if (p.heightCm != null && (p.heightCm < 120 || p.heightCm > 230)) errs.h = imperial() ? 'Enter a height from 4 ft to 7 ft 6 in.' : 'Enter a height from 120 to 230 cm.';
    if (p.weightKg != null && (p.weightKg < 35 || p.weightKg > 300)) errs.w = imperial() ? 'Enter a weight from 77 to 660 lb.' : 'Enter a weight from 35 to 300 kg.';
    return errs;
  }
  function updateProfilePreview() {
    const box = $('#pf-calc');

    LOSS_GOALS.forEach(k => {

      if (!r) return;

      if (teenNow && r.checked) {

  /* =========================================================
     Charts (SVG, drawn at the container's real width)
     ========================================================= */
  function niceMax(v) {
    if (v <= 0) return 1;
    const exp = Math.pow(10, Math.floor(Math.log10(v)));
    const f = v / exp;
    const steps = [1, 1.25, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
    return steps.find(st => f <= st) * exp;
  }
  function drawCharts() {
    $$('.chart-box[data-chart]').forEach(box => {
      const type = box.dataset.chart;
      const start = box.dataset.start;
      const w = Math.max(260, box.clientWidth || 600);
      if (type === 'week') box.innerHTML = weekChartSVG(weekDays(start), w);
      else if (type === 'trend') box.innerHTML = trendChartSVG(start, w);
      else if (type === 'activity-weeks') box.innerHTML = activityWeeksSVG(start, w);
    });
  }
  function weekChartSVG(days, W) {
    const H = 210, pl = 44, pr = 8, pt = 22, pb = 30;
    const iw = W - pl - pr, ih = H - pt - pb;
    const maxVal = niceMax(eVal(Math.max(500, ...days.map(d => Math.max(d.intake, d.target || 0))) * 1.08));
    const y = (kcal) => pt + ih - (eVal(kcal) / maxVal) * ih;
    const slot = iw / days.length;
    const bw = Math.min(36, slot * 0.56);
    let s = '';
    for (let i = 0; i <= 4; i++) {
      const v = maxVal * i / 4;
      const yy = pt + ih - (v / maxVal) * ih;
      s += `<line class="grid-line" x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}"></line><text x="${pl - 8}" y="${yy + 4}" text-anchor="end">${fmtNum(Math.round(v))}</text>`;
    }
    days.forEach((d, i) => {
      const x = pl + i * slot + (slot - bw) / 2;
      const over = !isTeen() && d.target && d.intake > d.target * 1.05;
      const h = d.intake > 0 ? Math.max(3, (pt + ih) - y(d.intake)) : 0;
      const label = `${WEEKDAYS_LONG[i]}, ${shortDate(d.key)}: ${d.logged ? E(d.intake) + ' eaten' : 'nothing logged'}${d.target ? `, target ${E(d.target)}` : ''}`;
      s += `<g><title>${esc(label)}</title>`;
      s += h ? `<rect class="${over ? 'bar-over' : 'bar-intake'}" x="${x}" y="${pt + ih - h}" width="${bw}" height="${h}" rx="${Math.min(7, bw / 3)}"></rect>`
        : `<rect class="bar-empty" x="${x}" y="${pt + ih - 4}" width="${bw}" height="4" rx="2"></rect>`;
      if (d.target) { const ty = y(d.target); s += `<line class="target-line" x1="${x - 5}" x2="${x + bw + 5}" y1="${ty}" y2="${ty}"></line>`; }
      if (h && slot > 40) s += `<text x="${x + bw / 2}" y="${pt + ih - h - 6}" text-anchor="middle" class="label-strong">${fmtNum(Math.round(eVal(d.intake)))}</text>`;
      s += `<text x="${x + bw / 2}" y="${H - 9}" text-anchor="middle" ${d.isToday ? 'class="label-strong"' : ''}>${d.label}</text></g>`;
    });
    const logged = days.filter(d => d.logged);
    const summary = `Energy eaten each day of the week of ${shortDate(days[0].key)}. ${logged.length} of 7 days logged.` +
      (logged.length ? ` Highest: ${E(Math.max(...logged.map(d => d.intake)))}.` : '');
    return `<svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(summary)}">${s}<text x="${pl - 8}" y="${pt - 10}" text-anchor="end">${eUnit()}</text></svg>`;
  }
  function weekSeries(endStart, n = 8) {
    return Array.from({ length: n }, (_, i) => {
      const ws = addDays(endStart, -7 * (n - 1 - i));
      const sum = weekSummary(ws);
      return { ws, ...sum };
    });
  }
  function trendChartSVG(endStart, W) {
    const weeks = weekSeries(endStart);
    const H = 200, pl = 44, pr = 12, pt = 20, pb = 30;
    const iw = W - pl - pr, ih = H - pt - pb;
    const vals = weeks.flatMap(w => [w.avgIntake || 0, w.avgTarget || 0]);
    const maxVal = niceMax(eVal(Math.max(500, ...vals) * 1.1));
    const x = (i) => pl + (weeks.length === 1 ? iw / 2 : (i / (weeks.length - 1)) * iw);
    const y = (kcal) => pt + ih - (eVal(kcal) / maxVal) * ih;
    let s = '';
    for (let i = 0; i <= 4; i++) {
      const v = maxVal * i / 4; const yy = pt + ih - (v / maxVal) * ih;
      s += `<line class="grid-line" x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}"></line><text x="${pl - 8}" y="${yy + 4}" text-anchor="end">${fmtNum(Math.round(v))}</text>`;
    }
    // target line
    const tpts = weeks.map((w, i) => w.avgTarget != null ? [x(i), y(w.avgTarget)] : null).filter(Boolean);
    if (tpts.length > 1) s += `<path class="target-line" d="M${tpts.map(p => p.join(',')).join(' L')}"></path>`;
    // intake line (segments over weeks with data)
    const pts = weeks.map((w, i) => w.avgIntake != null ? { x: x(i), y: y(w.avgIntake), w } : null);
    let seg = [];
    const segs = [];
    pts.forEach(p => { if (p) seg.push(p); else if (seg.length) { segs.push(seg); seg = []; } });
    if (seg.length) segs.push(seg);
    segs.forEach(sg => {
      if (sg.length > 1) {
        s += `<path class="trend-area" d="M${sg[0].x},${pt + ih} ${sg.map(p => `L${p.x},${p.y}`).join(' ')} L${sg[sg.length - 1].x},${pt + ih} Z"></path>`;
        s += `<path class="trend-line" d="M${sg.map(p => `${p.x},${p.y}`).join(' L')}"></path>`;
      }
    });
    pts.forEach((p, i) => {
      if (p) s += `<g><title>${esc(`Week of ${shortDate(p.w.ws)}: ${E(p.w.avgIntake)} a day on average (${p.w.loggedDays} days logged)`)}</title><circle class="point" cx="${p.x}" cy="${p.y}" r="${i === weeks.length - 1 ? 5.5 : 4}"></circle></g>`;
    });
    weeks.forEach((w, i) => {
      if (W < 420 && i % 2 === 1 && i !== weeks.length - 1) return;
      s += `<text x="${x(i)}" y="${H - 9}" text-anchor="middle">${esc(fmtDate(w.ws, { month: 'short', day: 'numeric' }))}</text>`;
    });
    const withData = weeks.filter(w => w.avgIntake != null);
    const summary = withData.length ? `Average daily energy eaten over 8 weeks. Latest week: ${weeks[weeks.length - 1].avgIntake != null ? E(weeks[weeks.length - 1].avgIntake) : 'no data'}.` : 'No meals logged in the last 8 weeks.';
    return `<svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(summary)}">${s}<text x="${pl - 8}" y="${pt - 8}" text-anchor="end">${eUnit()}</text></svg>`;
  }
  function activityWeeksSVG(endStart, W) {
    const weeks = weekSeries(endStart);
    const H = 200, pl = 40, pr = 8, pt = 20, pb = 30;
    const iw = W - pl - pr, ih = H - pt - pb;
    const maxVal = niceMax(Math.max(WEEKLY_ACTIVE_MINUTES * 1.2, ...weeks.map(w => w.minutes)) * 1.05);
    const y = (v) => pt + ih - (v / maxVal) * ih;
    const slot = iw / weeks.length; const bw = Math.min(30, slot * 0.55);
    let s = '';
    for (let i = 0; i <= 4; i++) {
      const v = maxVal * i / 4;
      s += `<line class="grid-line" x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"></line><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${fmtNum(Math.round(v))}</text>`;
    }
    weeks.forEach((w, i) => {
      const x = pl + i * slot + (slot - bw) / 2;
      const h = w.minutes > 0 ? Math.max(3, (pt + ih) - y(w.minutes)) : 0;
      s += `<g><title>${esc(`Week of ${shortDate(w.ws)}: ${fmtNum(w.minutes)} active minutes, ${w.sessions} sessions`)}</title>`;
      s += h ? `<rect class="bar-activity" x="${x}" y="${pt + ih - h}" width="${bw}" height="${h}" rx="${Math.min(6, bw / 3)}"></rect>`
        : `<rect class="bar-empty" x="${x}" y="${pt + ih - 4}" width="${bw}" height="4" rx="2"></rect>`;
      if (h && slot > 34) s += `<text x="${x + bw / 2}" y="${pt + ih - h - 6}" text-anchor="middle" class="label-strong">${fmtNum(w.minutes)}</text>`;
      if (!(W < 420 && i % 2 === 1 && i !== weeks.length - 1)) s += `<text x="${x + bw / 2}" y="${H - 9}" text-anchor="middle" ${i === weeks.length - 1 ? 'class="label-strong"' : ''}>${esc(fmtDate(w.ws, { month: 'short', day: 'numeric' }))}</text>`;
      s += '</g>';
    });
    s += `<line class="target-line" x1="${pl}" x2="${W - pr}" y1="${y(WEEKLY_ACTIVE_MINUTES)}" y2="${y(WEEKLY_ACTIVE_MINUTES)}"></line>`;
    const last = weeks[weeks.length - 1];
    return `<svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(`Active minutes per week for 8 weeks. Latest week: ${fmtNum(last.minutes)} minutes.`)}">${s}<text x="${pl - 8}" y="${pt - 8}" text-anchor="end">min</text></svg>`;
  }

  // ---------- Image handling ----------
  function compressImage(file, maxSide = 900, quality = 0.74) {
    return new Promise((resolve, reject) => {
      if (!file || !/^image\//.test(file.type || 'image/')) { reject(new Error('That file isn’t an image.')); return; }
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        try {
          const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
          const w = Math.max(1, Math.round(img.naturalWidth * scale)), h = Math.max(1, Math.round(img.naturalHeight * scale));
          const c = document.createElement('canvas'); c.width = w; c.height = h;
          const ctx = c.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          resolve(c.toDataURL('image/jpeg', quality));
        } catch (err) { URL.revokeObjectURL(url); reject(err); }
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('This image format couldn’t be read. Try a JPEG or PNG.')); };
      img.src = url;
    });
  }
