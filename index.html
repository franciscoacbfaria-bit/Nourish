          <div class="field span-2"><span class="field-label" id="ef-adj-lbl">Adjust portion</span>
            <div class="portion-chips" role="group" aria-labelledby="ef-adj-lbl">
              ${[[0.5, '½×'], [0.75, '¾×'], [1.25, '1¼×'], [1.5, '1½×'], [2, '2×']].map(([f, l]) => `<button type="button" class="chip" data-mult="${f}" aria-label="Multiply amount by ${f}">${l}</button>`).join('')}
            </div></div>
          <div class="field span-2" id="ef-grams-field" hidden><label for="ef-grams">Weight in grams</label>
            <div class="input-suffix"><input id="ef-grams" class="input" type="number" inputmode="decimal" min="0" step="any" value="${draft.gramsEq ?? ''}"><span class="suffix">g</span></div>
            <span class="hint">This food has no reliable weight for the chosen unit. Weigh it, or choose another unit, to calculate nutrition.</span></div>
          <div class="field span-2" id="ef-kcal-field" hidden><label for="ef-kcal">Energy, if you know it</label>
            <div class="input-suffix"><input id="ef-kcal" class="input" type="number" inputmode="decimal" min="0" step="any" value="${draft.kcalManual != null ? Math.round(eVal(draft.kcalManual)) : ''}"><span class="suffix">${eUnit()}</span></div>
            <span class="hint">For the whole amount, e.g. from a package label. Or <button type="button" class="card-link" id="ef-make-custom" style="padding:0">add it as a custom food</button> to track nutrients too.</span></div>
        </div>
        <div class="nutri-preview" id="ef-preview" aria-live="polite"></div>
        <div class="form-grid">
          <div class="field"><label for="ef-date">Date</label><input id="ef-date" class="input" type="date" value="${draft.date}"></div>
          <div class="field"><label for="ef-notes">Notes <span class="subtle">(optional)</span></label><input id="ef-notes" class="input" type="text" maxlength="200" value="${esc(draft.notes)}" placeholder="e.g. homemade, extra dressing"></div>
        </div>
        <div class="field" id="ef-photo-field"><span class="field-label">Photo <span class="subtle">(optional)</span></span><div id="ef-photo"></div></div>
      </form>`;
    const foot = `${existing ? `<button type="button" class="btn btn-danger left" id="ef-delete">${icon('trash', 'icon-sm')} Delete</button>` : ''}
      <button type="button" class="btn btn-outline" data-close>Cancel</button>
      <button type="submit" form="entry-form" class="btn btn-primary">${existing ? 'Save changes' : 'Add to meal'}</button>`;

    const m = openModal({
      title: existing ? 'Edit food' : photoMode ? 'Add a meal photo' : 'Add food', body, foot,
      initialFocus: photoMode ? '#ef-photo-take' : existing ? '#ef-qty' : '#ef-name',
      onMount: (root) => {
        const nameIn = $('#ef-name', root), list = $('#ef-list', root), unitSel = $('#ef-unit', root), qtyIn = $('#ef-qty', root);
        const gramsField = $('#ef-grams-field', root), kcalField = $('#ef-kcal-field', root), match = $('#ef-match', root), preview = $('#ef-preview', root);
        let activeIdx = -1, results = [];

        const currentFood = () => draft.foodId ? (findFood(draft.foodId) || draft.snap || null) : null;
        function fillUnits() {
          const food = currentFood();
          unitSel.innerHTML = UNITS.map(u => {
            let label = u.label;
            if (food && u.key !== 'g') {
              const per = unitGrams(food, u.key);
              const svl = food.sv && food.sv[u.key] ? food.sv[u.key][1] : null;
              label = per == null ? `${u.label} (no weight data)` : u.key === 'ml' ? `${u.label}` : `${u.label} · ${svl || '1'} = ${fmtNum(round(per, 1), 1)} g`;
            }
            return `<option value="${u.key}" ${draft.unit === u.key ? 'selected' : ''}>${esc(label)}</option>`;
          }).join('');
        }
        function syncFields() {
          const food = currentFood();
          const per = food ? unitGrams(food, draft.unit) : null;
          gramsField.hidden = !(food && per == null);
          kcalField.hidden = !!food || !draft.name.trim();
          if (food) match.innerHTML = `${icon('check', 'icon-sm')} From the encyclopedia · ${E(food.kcal)} per 100 g`;
          else if (draft.name.trim()) match.textContent = 'Not in the encyclopedia. Pick a suggestion, enter the energy, or add a custom food.';
          else match.textContent = 'Start typing to search 100+ foods.';
          match.style.display = 'flex'; match.style.gap = '4px'; match.style.alignItems = 'center';
        }
        function updatePreview() {
          draft.qty = num(qtyIn.value) || 0;
          draft.gramsEq = num($('#ef-grams', root).value);
          const kv = num($('#ef-kcal', root).value);
          draft.kcalManual = kv != null ? eToKcal(kv) : null;
          const food = currentFood();
          const n = entryNutrition(Object.assign({}, draft, { snap: food ? snapFood(food) : null }));
          preview.classList.toggle('unknown', !n.known && !!draft.name.trim());
          if (!draft.name.trim() && !photoData) { preview.innerHTML = `<span class="small muted">Choose a food to see its nutrition for this amount.</span>`; return; }
          if (!n.known) {
            preview.innerHTML = `<div class="np-main"><span class="np-kcal">—</span><span class="small">Nutrition not calculated</span></div>
              <span class="small muted">${n.reason === 'unit' ? 'Add the weight in grams, or switch to a unit with a known weight.' : 'This food isn’t in the encyclopedia. You can still save it, with or without an energy value.'}</span>`;
            return;
          }
          preview.innerHTML = n.p == null
            ? `<div class="np-main"><span class="np-kcal">${E(n.kcal)}</span><span class="small muted">entered by you</span></div>`
            : `<div class="np-main"><span class="np-kcal">${E(n.kcal)}</span><span class="small muted">for ${fmtNum(Math.round(n.grams))} g</span></div>
               <div class="macro-legend"><span><i class="dot" style="background:var(--protein)"></i>Protein ${G(n.p)}</span><span><i class="dot" style="background:var(--carbs)"></i>Carbs ${G(n.c)}</span><span><i class="dot" style="background:var(--fat)"></i>Fat ${G(n.f)}</span><span><i class="dot" style="background:var(--fiber)"></i>Fiber ${G(n.fib)}</span></div>`;
        }
        function selectFood(food) {
          draft.foodId = food.id;
          draft.name = food.name;
          nameIn.value = food.name;
          const per = unitGrams(food, draft.unit);
          if (per == null || (!existing && draft.unit === 'g' && draft.qty === 100) || (!existing && draft.unit === 'serving' && draft.qty === 1)) {
            const dp = defaultPortion(food); draft.unit = dp.unit; draft.qty = dp.qty; qtyIn.value = dp.qty;
          }
          closeList(); fillUnits(); syncFields(); updatePreview();
          $('#ef-name-err', root).hidden = true; nameIn.removeAttribute('aria-invalid');
        }
        function renderList() {
          results = searchFoods(nameIn.value, 'all', 8);
          if (!nameIn.value.trim() || !results.length) { closeList(); return; }
          list.innerHTML = results.map((f, i) => `<li role="option" id="ef-opt-${i}" data-i="${i}" aria-selected="${i === activeIdx}"><span>${esc(f.name)}</span><span class="meta">${E(f.kcal)}/100 g</span></li>`).join('');
          list.hidden = false; nameIn.setAttribute('aria-expanded', 'true');
          if (activeIdx >= 0) nameIn.setAttribute('aria-activedescendant', 'ef-opt-' + activeIdx); else nameIn.removeAttribute('aria-activedescendant');
        }
        function closeList() { list.hidden = true; activeIdx = -1; nameIn.setAttribute('aria-expanded', 'false'); nameIn.removeAttribute('aria-activedescendant'); }

        nameIn.addEventListener('input', () => {
          draft.name = nameIn.value;
          const food = currentFood();
          if (food && normalize(food.name) !== normalize(nameIn.value)) { draft.foodId = null; fillUnits(); }
          activeIdx = -1; renderList(); syncFields(); updatePreview();
        });
        nameIn.addEventListener('keydown', (e) => {
          if (list.hidden && e.key === 'ArrowDown') { renderList(); }
          if (list.hidden) return;
          if (e.key === 'ArrowDown') { e.preventDefault(); activeIdx = (activeIdx + 1) % results.length; renderList(); }
          else if (e.key === 'ArrowUp') { e.preventDefault(); activeIdx = (activeIdx - 1 + results.length) % results.length; renderList(); }
          else if (e.key === 'Enter') { if (activeIdx >= 0) { e.preventDefault(); selectFood(results[activeIdx]); } else if (results.length === 1) { e.preventDefault(); selectFood(results[0]); } }
          else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeList(); }
        });
        nameIn.addEventListener('blur', () => setTimeout(closeList, 150));
        list.addEventListener('mousedown', (e) => e.preventDefault());
        list.addEventListener('click', (e) => { const li = e.target.closest('li[data-i]'); if (li) selectFood(results[+li.dataset.i]); });

        unitSel.addEventListener('change', () => { draft.unit = unitSel.value; syncFields(); updatePreview(); });
        qtyIn.addEventListener('input', updatePreview);
        $('#ef-grams', root).addEventListener('input', updatePreview);
        $('#ef-kcal', root).addEventListener('input', updatePreview);
        $$('[data-step]', root).forEach(b => b.addEventListener('click', () => {
          const step = (UNIT_MAP[draft.unit] || UNIT_MAP.g).step * Number(b.dataset.step);
          qtyIn.value = Math.max(0, round((num(qtyIn.value) || 0) + step, 2));
          updatePreview();
        }));
        $$('[data-mult]', root).forEach(b => b.addEventListener('click', () => {
          const q = num(qtyIn.value) || 0;
          qtyIn.value = round(q * Number(b.dataset.mult), 2);
          updatePreview();
        }));
        $('#ef-make-custom', root).addEventListener('click', () => {
          openCustomFoodForm({ name: nameIn.value.trim(), onSaved: (food) => selectFood(food) });
        });

        // Photo
        const photoBox = $('#ef-photo', root);
        function renderPhoto() {
          if (photoData) {
            photoBox.innerHTML = `<div class="stack" style="gap:10px">
              <div class="photo-preview"><img src="${photoData}" alt="Selected meal photo"><button type="button" class="icon-btn" id="ef-photo-remove" aria-label="Remove photo">${icon('x')}</button></div>
              <div class="field"><label for="ef-photo-desc">Describe the photo</label><textarea id="ef-photo-desc" class="textarea" maxlength="500" placeholder="What's on the plate? e.g. grilled sardines, boiled potatoes, salad with olive oil">${esc(draft.photoDesc)}</textarea>
              <span class="hint">A photo is a visual record. It can't measure portions or nutrients.</span></div></div>`;
            $('#ef-photo-remove', root).addEventListener('click', () => { photoData = null; photoChanged = true; renderPhoto(); updatePreview(); });
            $('#ef-photo-desc', root).addEventListener('input', (e) => { draft.photoDesc = e.target.value; });
          } else {
            photoBox.innerHTML = `<div class="photo-drop" id="ef-drop">
              <span class="leading" aria-hidden="true">${icon('camera')}</span>
              <div class="grow small muted" style="flex:1;min-width:160px">Take a photo or upload one. You can also drop an image here.</div>
              <div class="row wrap" style="gap:8px">
                <label class="btn btn-sm btn-primary" id="ef-photo-take" tabindex="0" role="button">${icon('camera', 'icon-sm')} Take photo<input type="file" accept="image/*" capture="environment" class="sr-only" id="ef-cam" tabindex="-1"></label>
                <label class="btn btn-sm btn-outline" tabindex="0" role="button">${icon('image', 'icon-sm')} Upload<input type="file" accept="image/*" class="sr-only" id="ef-file" tabindex="-1"></label>
              </div></div>`;
            const handle = async (file) => {
              if (!file) return;
              try {
                photoBox.querySelector('.grow').textContent = 'Preparing photo…';
                photoData = await compressImage(file);
                photoChanged = true;
                renderPhoto(); updatePreview();
              } catch (err) { toast(err.message || 'Couldn’t read that image.', { error: true }); renderPhoto(); }
            };
            ['#ef-cam', '#ef-file'].forEach(sel => $(sel, root).addEventListener('change', (e) => handle(e.target.files && e.target.files[0])));
            $$('label[role=button]', photoBox).forEach(l => l.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('input', l).click(); } }));
            const drop = $('#ef-drop', root);
            drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('dragging'); });
            drop.addEventListener('dragleave', () => drop.classList.remove('dragging'));
            drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('dragging'); handle(e.dataTransfer.files && e.dataTransfer.files[0]); });
          }
        }
        renderPhoto();
        fillUnits(); syncFields(); updatePreview();
        if (photoMode && !photoData) { try { $('#ef-cam', root).click(); } catch (e) { /* the buttons stay available */ } }

        if (existing) {
          $('#ef-delete', root).addEventListener('click', async () => {
            const ok = await confirmDialog({ title: 'Delete this food?', message: `“${existing.name}” will be removed from ${MEAL_MAP[existing.meal].label.toLowerCase()} on ${longDate(existing.date)}.` });
            if (ok) { m.close(); deleteEntry(existing.id); }
          });
        }

        $('#entry-form', root).addEventListener('submit', (e) => {
          e.preventDefault();
          draft.meal = ($('input[name="ef-meal"]:checked', root) || {}).value || draft.meal;
          draft.name = nameIn.value.trim();
          draft.notes = $('#ef-notes', root).value.trim();
          const dv = $('#ef-date', root).value;
          draft.date = isValidKey(dv) ? dv : draft.date;
          updatePreview();
          let valid = true;
          if (!draft.name && photoData) { draft.name = 'Meal photo'; }
          if (!draft.name) { valid = false; $('#ef-name-err', root).hidden = false; nameIn.setAttribute('aria-invalid', 'true'); nameIn.focus(); }
          if (!(draft.qty > 0)) { valid = false; $('#ef-qty-err', root).hidden = false; qtyIn.setAttribute('aria-invalid', 'true'); if (draft.name) qtyIn.focus(); }
          else { $('#ef-qty-err', root).hidden = true; qtyIn.removeAttribute('aria-invalid'); }
          if (!valid) return;

          const food = currentFood();
          const per = food ? unitGrams(food, draft.unit) : null;
          const now = Date.now();
          const entry = {
            id: existing ? existing.id : uid(),
            date: draft.date, meal: draft.meal, foodId: food ? food.id : null, name: draft.name,
            qty: round(draft.qty, 3), unit: draft.unit,
            gramsEq: food && per == null && draft.gramsEq > 0 ? draft.gramsEq : null,
            kcalManual: !food && draft.kcalManual != null && draft.kcalManual >= 0 ? round(draft.kcalManual, 1) : null,
            notes: draft.notes, photoId: existing ? existing.photoId : null, photoDesc: photoData ? (draft.photoDesc || '').trim() : '',
            snap: food ? snapFood(food) : null,
            createdAt: existing ? existing.createdAt : now, updatedAt: now, demo: false
          };
          let photoFailed = false;
          if (photoChanged) {
            if (entry.photoId) Store.removePhoto(entry.photoId);
            entry.photoId = null;
            if (photoData) {
              const pid = uid();
              if (Store.setPhoto(pid, photoData)) entry.photoId = pid; else { photoFailed = true; entry.photoDesc = ''; }
            }
          }
          if (existing) Object.assign(existing, entry); else state.entries.push(entry);
          commit();
          m.close();
          if (currentView() === 'meals') ui.mealsDate = entry.date;
          refresh();
          if (photoFailed) toast('Entry saved, but the photo didn’t fit in browser storage. Remove older photos or export a backup first.', { error: true, timeout: 8000 });
          else toast(existing ? 'Changes saved' : `Added to ${MEAL_MAP[entry.meal].label.toLowerCase()}${entry.date !== todayKey() ? ` on ${relDay(entry.date)}` : ''}`);
        });
      }
    });
  }

  function deleteEntry(id) {
    const idx = state.entries.findIndex(e => e.id === id);
    if (idx < 0) return;
    const [e] = state.entries.splice(idx, 1);
    const photo = e.photoId ? Store.getPhoto(e.photoId) : null;
    if (e.photoId) Store.removePhoto(e.photoId);
    commit(); refresh();
    toast(`Deleted ${e.name}`, {
      action: 'Undo', timeout: 7000, onAction: () => {
        state.entries.splice(Math.min(idx, state.entries.length), 0, e);
        if (photo && !Store.setPhoto(e.photoId, photo)) { e.photoId = null; }
        commit(); refresh(); toast('Restored');
      }
    });
  }

  // ---------- Photo viewer ----------
  function openPhotoViewer(id) {
    const e = state.entries.find(x => x.id === id);
    if (!e) return;
    const src = Store.getPhoto(e.photoId);
    const n = entryNutrition(e);
    const m = openModal({
      title: e.name, wide: true,
      body: `
        ${src ? `<img class="viewer-img" src="${src}" alt="Meal photo: ${esc(e.photoDesc || e.name)}">` : emptyState('image', 'Photo not found', 'It may have been removed from browser storage.', '', true)}
        <div class="chips"><span class="chip">${icon('calendar', 'icon-sm')} ${esc(longDate(e.date))}</span><span class="chip">${icon(MEAL_MAP[e.meal].icon, 'icon-sm')} ${MEAL_MAP[e.meal].label}</span>
          <span class="chip">${esc(qtyText(e))}</span>${n.known ? `<span class="chip accent">${E(n.kcal)}</span>` : ''}</div>
        <div class="field"><label for="pv-desc">Description</label><textarea id="pv-desc" class="textarea" maxlength="500" placeholder="Describe what's on the plate">${esc(e.photoDesc)}</textarea></div>
        <p class="note">${icon('info', 'icon-sm')}<span>Photos don't measure food. Nutrition comes from the food and amount on the entry.</span></p>`,
      foot: `<button type="button" class="btn btn-danger left" id="pv-remove">${icon('trash', 'icon-sm')} Remove photo</button>
        <button type="button" class="btn btn-outline" id="pv-edit">${icon('edit', 'icon-sm')} Edit entry</button>
        <button type="button" class="btn btn-primary" id="pv-save">Save description</button>`,
      onMount: (root) => {
        $('#pv-save', root).addEventListener('click', () => { e.photoDesc = $('#pv-desc', root).value.trim(); e.updatedAt = Date.now(); commit(); m.close(); refresh(); toast('Description saved'); });
        $('#pv-edit', root).addEventListener('click', () => { m.close(); openEntryForm({ id: e.id }); });
        $('#pv-remove', root).addEventListener('click', async () => {
          const ok = await confirmDialog({ title: 'Remove this photo?', message: 'The food entry stays; only the photo and its description are removed.', confirmLabel: 'Remove photo' });
          if (!ok) return;
          Store.removePhoto(e.photoId); e.photoId = null; e.photoDesc = ''; commit(); m.close(); refresh(); toast('Photo removed');
        });
      }
    });
  }

  // ---------- Food detail ----------
  function openFoodDetail(id) {
    const f = findFood(id);
    if (!f) return;
    const rows = [['100 g', 100]];
    UNITS.forEach(u => {
      if (u.key === 'g') return;
      const per = unitGrams(f, u.key);
      if (per == null) return;
      const label = f.sv && f.sv[u.key] ? f.sv[u.key][1] : u.key === 'ml' ? '100 ml' : `1 ${u.one} (${u.key === 'cup' ? CUP_ML : u.key === 'tbsp' ? TBSP_ML : TSP_ML} ml)`;
      rows.push([label, u.key === 'ml' ? per * 100 : per]);
    });
    const servingRows = rows.map(([label, grams]) => `<tr><td>${esc(label)}</td><td class="r">${fmtNum(round(grams, 1), 1)} g</td><td class="r">${E(f.kcal * grams / 100)}</td><td class="r">${G(f.p * grams / 100)}</td></tr>`).join('');
    const pe = f.p * 4, ce = f.c * 4, fe = f.f * 9, tot = pe + ce + fe || 1;
    const m = openModal({
      title: f.name, wide: true,
      body: `
        <div class="chips"><span class="chip">${esc(catLabel(f.cat))}</span>${f.custom ? '<span class="chip accent">My food</span>' : '<span class="chip">USDA reference values</span>'}${f.ml ? `<span class="chip">${fmtNum(f.ml, 2)} g per ml</span>` : ''}</div>
        <div class="grid grid-2" style="gap:16px;align-items:start">
          <div>
            <h3 style="margin-bottom:6px">Per 100 g</h3>
            <table class="nutri-table"><tbody>
              <tr><th scope="row">Energy</th><td class="r"><strong>${E(f.kcal)}</strong>${state.settings.energy === 'kcal' ? ` <span class="subtle">· ${fmtNum(Math.round(f.kcal * KJ_PER_KCAL))} kJ</span>` : ''}</td></tr>
              <tr><th scope="row"><span class="dot" style="background:var(--protein)"></span> Protein</th><td class="r">${G(f.p)}</td></tr>
              <tr><th scope="row"><span class="dot" style="background:var(--carbs)"></span> Carbohydrates</th><td class="r">${G(f.c)}</td></tr>
              <tr><th scope="row"><span class="dot" style="background:var(--fat)"></span> Fat</th><td class="r">${G(f.f)}</td></tr>
              <tr><th scope="row"><span class="dot" style="background:var(--fiber)"></span> Fiber</th><td class="r">${G(f.fib)}</td></tr>
            </tbody></table>
          </div>
          <div>
            <h3 style="margin-bottom:10px">Energy split</h3>
            <div class="macro-stack" style="height:12px" aria-hidden="true"><span style="width:${pe / tot * 100}%;background:var(--protein)"></span><span style="width:${ce / tot * 100}%;background:var(--carbs)"></span><span style="width:${fe / tot * 100}%;background:var(--fat)"></span></div>
            <div class="macro-legend" style="margin-top:10px"><span><i class="dot" style="background:var(--protein)"></i>Protein ${Math.round(pe / tot * 100)}%</span><span><i class="dot" style="background:var(--carbs)"></i>Carbs ${Math.round(ce / tot * 100)}%</span><span><i class="dot" style="background:var(--fat)"></i>Fat ${Math.round(fe / tot * 100)}%</span></div>
          </div>
        </div>
        <div><h3 style="margin-bottom:6px">Common serving sizes</h3>
          <div class="table-wrap"><table class="nutri-table"><thead><tr><th scope="col">Serving</th><th scope="col" class="r">Weight</th><th scope="col" class="r">Energy</th><th scope="col" class="r">Protein</th></tr></thead><tbody>${servingRows}</tbody></table></div>
          ${rows.length === 1 ? '<p class="xsmall subtle" style="margin-top:6px">No household measures on record for this food. Log it in grams.</p>' : ''}
        </div>`,
      foot: `${f.custom ? `<button type="button" class="btn btn-danger left" id="fd-delete">${icon('trash', 'icon-sm')} Delete</button><button type="button" class="btn btn-outline" id="fd-edit">${icon('edit', 'icon-sm')} Edit</button>` : '<button type="button" class="btn btn-outline" data-close>Close</button>'}
        <button type="button" class="btn btn-primary" id="fd-log">${icon('plus', 'icon-sm')} Log this food</button>`,
      onMount: (root) => {
        $('#fd-log', root).addEventListener('click', () => { m.close(); openEntryForm({ foodId: f.id }); });
        if (f.custom) {
          $('#fd-edit', root).addEventListener('click', () => { m.close(); openCustomFoodForm({ id: f.id }); });
          $('#fd-delete', root).addEventListener('click', async () => {
            const used = state.entries.filter(e => e.foodId === f.id).length;
            const ok = await confirmDialog({ title: 'Delete this custom food?', message: used ? `${used} logged entr${used === 1 ? 'y keeps' : 'ies keep'} their saved nutrition values.` : 'It will be removed from your food list.' });
            if (!ok) return;
            state.customFoods = state.customFoods.filter(x => x.id !== f.id);
            commit(); m.close(); refresh(); toast(`Deleted ${f.name}`);
          });
        }
      }
    });
  }

  // ---------- Custom food form ----------
  function openCustomFoodForm({ id = null, name = '', onSaved } = {}) {
    const existing = id ? state.customFoods.find(f => f.id === id) : null;
    const f = existing || { name, cat: 'other', kcal: null, p: null, c: null, f: null, fib: null, ml: null, sv: {} };
    const sv = f.sv || {};
    const v = (x) => x == null ? '' : x;
    const m = openModal({
      title: existing ? 'Edit custom food' : 'Add custom food', wide: true,
      body: `
        <form id="cf-form" class="stack" novalidate>
          <div class="form-grid">
            <div class="field"><label for="cf-name">Name</label><input id="cf-name" class="input" maxlength="80" value="${esc(f.name)}" placeholder="e.g. Pastel de nata"><span class="field-error" id="cf-name-err" hidden>Enter a name.</span></div>

        $('#cf-calc', root).addEventListener('click', () => {
          const p = num($('#cf-p', root).value) || 0, c = num($('#cf-c', root).value) || 0, fa = num($('#cf-f', root).value) || 0, fib = num($('#cf-fib', root).value) || 0;

        $('#cf-form', root).addEventListener('submit', (e) => {
          e.preventDefault();

          toast(existing ? 'Custom food updated' : `${name} added to My foods`);
          if (onSaved) onSaved(food);
        });
      }
    });

    const existing = id ? state.activities.find(a => a.id === id) : null;
    if (id && !existing) return;
    const a = existing ? Object.assign({}, existing) : { date: isValidKey(date) ? date : todayKey(), type: 'walking', name: 'Walking', duration: 30, kcal: null, notes: '' };
    let nameEdited = existing ? a.name !== (ACTIVITY_MAP[a.type] || {}).label : false;
    const w = state.profile.weightKg;
    const m = openModal({
      title: existing ? 'Edit activity' : 'Log activity',
      body: `
        <form id="act-form" class="stack" novalidate>
          <div class="form-grid">
            <div class="field"><label for="af-type">Activity</label><select id="af-type" class="select">${ACTIVITY_TYPES.map(t => `<option value="${t.key}" ${a.type === t.key ? 'selected' : ''}>${t.label}</option>`).join('')}</select></div>

            <div class="field span-2"><label for="af-kcal">Estimated energy burned <span class="subtle">(optional)</span></label>
              <div class="row" style="gap:8px"><div class="input-suffix" style="flex:1"><input id="af-kcal" class="input" type="number" inputmode="numeric" min="0" step="1" value="${a.kcal != null ? Math.round(eVal(a.kcal)) : ''}"><span class="suffix">${eUnit()}</span></div>
              <button type="button" class="btn btn-outline" id="af-est" ${w ? '' : 'disabled'}>${icon('flame', 'icon-sm')} Estimate</button></div>
              <span class="hint" id="af-hint">${w ? `Estimate uses your weight (${weightText(w)}) and the activity's MET value.` : 'Add your weight in Settings to estimate energy automatically.'}</span></div>
            <div class="field span-2"><label for="af-notes">Notes <span class="subtle">(optional)</span></label><input id="af-notes" class="input" maxlength="200" value="${esc(a.notes)}" placeholder="e.g. hilly route, Seated yoga class"></div>
          </div>
        </form>`,
      foot: `${existing ? `<button type="button" class="btn btn-danger left" id="af-delete">${icon('trash', 'icon-sm')} Delete</button>` : ''}
        <button type="button" class="btn btn-outline" data-close>Cancel</button><button type="submit" form="act-form" class="btn btn-primary">${existing ? 'Save changes' : 'Log activity'}</button>`,
      onMount: (root) => {
        const typeSel = $('#af-type', root), nameIn = $('#af-name', root), durIn = $('#af-dur', root), kcalIn = $('#af-kcal', root), dateIn = $('#af-date', root);
        const showWeekday = () => { $('#af-weekday', root).textContent = isValidKey(dateIn.value) ? WEEKDAYS_LONG[weekdayIdx(dateIn.value)] : ''; };
        showWeekday(); dateIn.addEventListener('change', showWeekday);
        nameIn.addEventListener('input', () => { nameEdited = true; });
        typeSel.addEventListener('change', () => {
          const t = ACTIVITY_MAP[typeSel.value];
          if (!nameEdited || !nameIn.value.trim()) { nameIn.value = t.key === 'other' ? '' : t.label; nameEdited = false; }
          $('#af-est', root).disabled = !w || t.met == null;
          $('#af-hint', root).textContent = t.met == null ? 'No MET value for “Other”. Enter your own estimate, e.g. from a fitness watch.' : (w ? `Estimate uses your weight (${weightText(w)}) and a MET of ${t.met}.` : 'Add your weight in Settings to estimate energy automatically.');
        });
        $('#af-est', root).addEventListener('click', () => {
          const est = estimateActivityKcal(typeSel.value, num(durIn.value));
          if (est == null) { toast('Enter a duration first.'); durIn.focus(); return; }
          kcalIn.value = Math.round(eVal(est));
          $('#af-hint', root).textContent = `Estimated: (MET ${ACTIVITY_MAP[typeSel.value].met} − 1) × ${fmtNum(round(w, 1), 1)} kg × ${fmtNum(round(num(durIn.value) / 60, 2), 2)} h. Adjust if you know better.`;
        });
        if (existing) $('#af-delete', root).addEventListener('click', async () => {
          const ok = await confirmDialog({ title: 'Delete this activity?', message: `“${existing.name}” on ${longDate(existing.date)} will be removed.` });
          if (ok) { m.close(); deleteActivity(existing.id); }
        });
        $('#act-form', root).addEventListener('submit', (e) => {
          e.preventDefault();
          const name = nameIn.value.trim();
          const dur = num(durIn.value);
          const kv = num(kcalIn.value);
          let ok = true;
          $('#af-name-err', root).hidden = !!name; if (!name) ok = false;
          const durOk = dur != null && dur >= 1 && dur <= 1440;
          $('#af-dur-err', root).hidden = durOk; if (!durOk) ok = false;
          if (!ok) return;
          const now = Date.now();
          const rec = {
            id: existing ? existing.id : uid(), date: isValidKey(dateIn.value) ? dateIn.value : a.date, type: typeSel.value, name,
            duration: Math.round(dur), kcal: kv != null && kv >= 0 ? Math.round(eToKcal(kv)) : null, notes: $('#af-notes', root).value.trim(),
            createdAt: existing ? existing.createdAt : now, updatedAt: now, demo: false
          };
          if (existing) Object.assign(existing, rec); else state.activities.push(rec);
          commit(); m.close();
          if (currentView() === 'activity') ui.activityWeek = weekStartOf(rec.date);
          refresh();
          toast(existing ? 'Activity updated' : `${rec.name} logged for ${relDay(rec.date)}`);
        });
      }
    });
  }
  function deleteActivity(id) {
    const idx = state.activities.findIndex(a => a.id === id);
    if (idx < 0) return;
    const [a] = state.activities.splice(idx, 1);
    commit(); refresh();
    toast(`Deleted ${a.name}`, { action: 'Undo', timeout: 7000, onAction: () => { state.activities.splice(Math.min(idx, state.activities.length), 0, a); commit(); refresh(); toast('Restored'); } });
  }

  /* =========================================================
     Assistant
     Uses Claude through the page's `sample` capability when the page is opened in Claude
     (on the viewer's own account, after they allow it). Elsewhere it falls back to a
     small built-in parser for simple commands. Every change can be undone.
     ========================================================= */
  let sampleNs; // undefined: not checked yet; null: unavailable
  function getSample() {
    if (sampleNs !== undefined) return Promise.resolve(sampleNs);
    if (!(window.claude && typeof window.claude.use === 'function')) { sampleNs = null; return Promise.resolve(null); }
    return Promise.race([
      Promise.resolve(window.claude.use('sample')).catch(() => null),
      new Promise(r => setTimeout(() => r(null), 10000))
    ]).then(ns => { sampleNs = ns || null; return sampleNs; });
  }
  const assistantMode = () => isTeen() ? 'teen' : sampleNs === undefined ? 'checking' : (sampleNs && !ui.aLocalOnly ? 'claude' : 'local');

  // Places in the app where the user types their own data.
  const LINKS = {
    profile: { label: 'Open profile', view: 'preferences', section: 'profile-card' },
    plan: { label: 'Open weekly calorie plan', view: 'activity', section: 'weekly-plan' },
    meals: { label: 'Open meals', view: 'meals' },
    activity: { label: 'Open activity', view: 'activity' }
  };
  function linkFor(view, section) {
    if (view === 'preferences' && section === 'profile-card') return LINKS.profile;
    if (section === 'weekly-plan') return { label: 'Open weekly calorie plan', view: VIEWS[view] ? view : 'activity', section };
    const names = { today: 'Today', meals: 'meals', foods: 'food encyclopedia', journal: 'photo journal', activity: 'activity', history: 'history', preferences: 'settings', assistant: 'assistant' };
    return { label: `Open ${names[view] || view}`, view, section: section || null };
  }
  function assistantGreeting() {
    const p = state.profile;
    const needsSetup = !profileComplete(p) || p.demo;
    return {
      id: uid(), role: 'assistant',
      text: `Hi${p.name && !p.demo ? ' ' + p.name : ''}! I'm here to help you use Nourish and to adjust the app for you: your goal, appearance and units. I can also explain how your daily ${LW()} works.\n\nYou type your personal details, weekly calorie burn, meals and activities yourself${needsSetup ? '. Start with your profile and weekly plan:' : '.'}`,
      links: needsSetup ? [LINKS.profile, LINKS.plan] : [],
      quick: ['How is my ' + LW() + ' calculated?', 'Explain the goals', 'Switch to dark mode', 'What can you do?']
    };
  }

  function mdLite(text) {
    const lines = esc(text).split('\n');
    let html = '', inList = false;
    for (const raw of lines) {
      const line = raw.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      if (/^\s*[-•]\s+/.test(line)) { if (!inList) { html += '<ul>'; inList = true; } html += `<li>${line.replace(/^\s*[-•]\s+/, '')}</li>`; }
      else { if (inList) { html += '</ul>'; inList = false; } if (line.trim()) html += `<p>${line}</p>`; }
    }
    return html + (inList ? '</ul>' : '');
  }
  function msgHTML(m) {
    if (m.role === 'user') return `<div class="msg user"><span class="sr-only">You said: </span>${mdLite(m.text)}</div>`;
    const canUndo = lastUndo && lastUndo.msgId === m.id && !m.undone;
    const changes = (m.changes || []).map(c => `<li>${icon('check', 'icon-sm')}<span>${esc(c)}</span></li>`).join('')
      + (m.errors || []).map(c => `<li class="err">${icon('info', 'icon-sm')}<span>${esc(c)}</span></li>`).join('');
    return `<div class="msg assistant"><span class="sr-only">Assistant: </span>${mdLite(m.text || '')}
      ${changes ? `<ul class="msg-changes" aria-label="Changes made">${changes}</ul>` : ''}
      ${(m.links || []).length ? `<div class="row wrap msg-links">${m.links.map(l => `<button type="button" class="btn btn-sm btn-outline" data-action="goto" data-view="${esc(l.view)}"${l.section ? ` data-section="${esc(l.section)}"` : ''}>${icon('chevron-right', 'icon-sm')} ${esc(l.label)}</button>`).join('')}</div>` : ''}
      ${m.undone ? '<p class="xsmall subtle" style="margin-top:6px">These changes were undone.</p>' : ''}
      ${canUndo || m.retry ? `<div class="row wrap" style="margin-top:10px">
        ${canUndo ? `<button type="button" class="btn btn-sm btn-outline" data-action="assistant-undo" data-id="${m.id}">${icon('history', 'icon-sm')} Undo changes</button>` : ''}
        ${m.retry ? `<button type="button" class="btn btn-sm btn-outline" data-action="assistant-retry" data-id="${m.id}">Try again</button>` : ''}</div>` : ''}
    </div>`;
  }
  function modeChipHTML() {
    const mode = assistantMode();
    if (mode === 'claude') return `<span class="chip accent" title="Answers come from Claude on your account">${icon('sparkle', 'icon-sm')} Claude</span>`;
    if (mode === 'teen') return `<span class="chip accent" title="Claude accounts are for adults (18+), so under-18 profiles use Nourish's built-in assistant. Nothing is sent to Claude.">Built-in assistant · under 18</span>`;
    if (mode === 'local' && !ui.aLocalOnly && !window.claude) return `<span class="chip accent" title="Runs on this device. Nothing you type leaves it.">Built-in assistant</span>`;
    if (mode === 'local') return `<span class="chip warn" title="Claude isn't available in this view. I understand simple commands.">Simple commands</span>`;
    return '<span class="chip">Connecting…</span>';
  }
  function renderAssistant() {
    const msgs = state.chat.length ? state.chat : [assistantGreeting()];
    const last = msgs[msgs.length - 1];
    const quick = !ui.aBusy && last && last.role === 'assistant' && Array.isArray(last.quick) ? last.quick.slice(0, 5) : [];
    return `
      <header class="view-header">
        <div><div class="eyebrow">Assistant</div><h1 tabindex="-1">Ask Nourish</h1><p class="sub">Ask for help, or ask me to adjust the app: goal, appearance and units. Every change can be undone.</p></div>
        <div class="header-actions"><span id="assistant-mode">${modeChipHTML()}</span>
          ${state.chat.length ? `<button type="button" class="btn btn-sm btn-outline" data-action="assistant-clear">Clear conversation</button>` : ''}</div>
      </header>
      <section class="card chat-card" aria-label="Conversation with the assistant">
        <div class="chat-log" id="chat-log" role="log" aria-live="polite" aria-relevant="additions">
          ${msgs.map(msgHTML).join('')}
          ${ui.aBusy ? '<div class="msg assistant typing" role="status" aria-label="The assistant is thinking"><span></span><span></span><span></span></div>' : ''}
        </div>
        ${quick.length ? `<div class="chat-quick" role="group" aria-label="Suggested replies">${quick.map(q => `<button type="button" class="chip" data-action="assistant-say" data-text="${esc(q)}">${esc(q)}</button>`).join('')}</div>` : ''}
        <form id="assistant-form" class="composer" novalidate>
          <label for="assistant-input" class="sr-only">Message the assistant</label>
          <textarea id="assistant-input" class="textarea" rows="1" maxlength="1200" placeholder="e.g. Why is today a rest day? or Switch to dark mode" ${ui.aBusy ? 'disabled' : ''}>${esc(ui.aDraft)}</textarea>
          ${ui.aBusy ? `<button type="button" class="btn btn-outline composer-btn" data-action="assistant-stop">${icon('stop', 'icon-sm')} Stop</button>`
            : `<button type="submit" class="btn btn-primary composer-btn" aria-label="Send">${icon('send')}</button>`}
        </form>
      </section>
      <p class="note">${icon('info', 'icon-sm')}<span>${isTeen() ? 'Under 18, the assistant uses Nourish\u2019s built-in commands and nothing you type leaves this browser. It gives general guidance, not medical advice. For worries about food or weight, talk to a parent, school nurse or doctor.' : 'When this page is opened in Claude, the assistant uses Claude on your account (adults 18+; you\u2019re asked once to allow it) and receives your Nourish profile, plan and recent log with each message. Under-18 profiles and other places use built-in commands only. It gives general guidance, not medical advice.'}</span></p>`;
  }
  function afterAssistantRender() {
    const log = $('#chat-log');
    if (log) log.scrollTop = log.scrollHeight;
    autosizeComposer();
    if (sampleNs === undefined) getSample().then(() => { const el = $('#assistant-mode'); if (el) el.innerHTML = modeChipHTML(); });
  }
  function autosizeComposer() {
    const ta = $('#assistant-input');
    if (!ta) return;
    ta.style.height = 'auto';
    ta.style.height = Math.min(160, ta.scrollHeight + 2) + 'px';
  }

  // ---------- Context sent to Claude ----------
  function assistantContext() {
    const t = todayKey();
    const p = state.profile;
    const ws = weekStartOf(t);
    const tot = dayTotals(t);
    return {
      today: t, todayWeekday: WEEKDAYS_LONG[weekdayIdx(t)],
      profile: { name: p.name || null, sex: p.sex || null, age: p.age, heightCm: p.heightCm, weightKg: p.weightKg, lifestyle: p.lifestyle, goal: p.goal, goalChosenByUser: !!p.goalChosen, isExampleProfile: !!p.demo },
      dayAmounts: { restDayKcal: isTeen(p) ? 0 : REST_DAY_ADJ, trainingDayKcal: TRAINING_DAY_ADJ },

  function localFollowUp(result, appliedCount) {

      return { text: pt
        ? 'Parece que a comida ou o teu corpo estão a ser difíceis neste momento, e isso importa. Não te posso ajudar a comer menos, mas mereces apoio: fala com os teus pais ou encarregado de educação, a enfermeira da escola, o teu médico ou alguém em quem confies. Em Portugal podes ligar para o SNS 24: 808 24 24 24. Se alguma vez te sentires em perigo, liga 112.'
        : 'It sounds like food or your body might be hard right now, and that matters. I can\u2019t help with eating less, but you deserve support: please talk to a parent or guardian, a school nurse, your doctor or someone you trust. In Portugal you can call SNS 24 on 808 24 24 24; elsewhere, your local health line can help. If you ever feel unsafe, call 112 (or your local emergency number).' };

    if (r.includes('activity')) { parts.push(pt ? 'As atividades registam-se em Atividade.' : 'You log activities yourself in Activity.'); links.push(LINKS.activity); }
    if (result.ask === 'explain') { const ex = explainTarget(pt); parts.push(ex.text); (ex.links || []).forEach(l => links.push(l)); }
    if (result.ask === 'goals') parts.push(goalsText(pt));
    if (result.ask === 'amounts') { parts.push(amountsText(pt)); if (!links.includes(LINKS.plan)) links.push(LINKS.plan); }

        : 'I can help you use Nourish and adjust the app:\n- change your goal\n- switch theme, kg/lb or kcal/kJ\n- explain your daily target and rest and training days\nYour profile, weekly plan, meals and activities are typed in by you.');

      parts.push(pt ? 'Dica: preenche o teu perfil para teres objetivos diários.' : 'Tip: fill in your profile to get your daily targets.');

  let downloadsNs;
  function getDownloads() {
    if (downloadsNs !== undefined) return Promise.resolve(downloadsNs);
    if (!(window.claude && typeof window.claude.use === 'function')) return Promise.resolve(null);
    return Promise.race([
      Promise.resolve(window.claude.use('downloads')).catch(() => null),
      new Promise(r => setTimeout(() => r(null), 10000))
    ]).then(ns => { downloadsNs = ns || null; return downloadsNs; });
  }
  async function saveFile(filename, text, mime) {
    const hosted = !!(window.claude && typeof window.claude.use === 'function');
    if (hosted) {
      const dl = await getDownloads();
      if (dl) {
        try { await dl.save({ filename, data: new Blob([text], { type: mime }) }); toast(`Saved ${filename}`); return; }
        catch (err) {
          const code = err && err.code;
          if (code === 'declined') { toast('Download canceled'); return; }
          if (code === 'rate_limited') { toast('A save prompt is already open. Try again in a moment.'); return; }
        }
      }
      showCopyDialog(filename, text);
      return;
    }
    try {
      const blob = new Blob([text], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.rel = 'noopener';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      toast(`Downloading ${filename}`);
    } catch (e) { showCopyDialog(filename, text); }
  }
  function showCopyDialog(filename, text) {
    const big = text.length > 400000;
    openModal({
      title: 'Copy your export', wide: true,
      body: `<p class="small muted">Downloads aren't available here. Copy the text below and save it as <strong>${esc(filename)}</strong>.</p>
        <textarea class="textarea" id="copy-text" readonly style="min-height:220px;font-family:ui-monospace,Menlo,monospace;font-size:12px" aria-label="Export text">${big ? '' : esc(text)}</textarea>
        ${big ? '<p class="xsmall subtle">The export is large, so it isn’t shown. Use Copy to clipboard.</p>' : ''}`,
      foot: `<button type="button" class="btn btn-outline" data-close>Close</button><button type="button" class="btn btn-primary" id="copy-btn">${icon('copy', 'icon-sm')} Copy to clipboard</button>`,
      onMount: (root) => {
        $('#copy-btn', root).addEventListener('click', async () => {
          try { await navigator.clipboard.writeText(text); toast('Copied to clipboard'); }
          catch (e) { const ta = $('#copy-text', root); if (!big) { ta.focus(); ta.select(); toast('Press Ctrl+C or ⌘C to copy the selected text.'); } else toast('Copying was blocked by the browser.', { error: true }); }
        });
      }
    });
  }
  function buildBackup(includePhotos) {
    const photos = {};
    if (includePhotos) state.entries.forEach(e => { if (e.photoId) { const p = Store.getPhoto(e.photoId); if (p) photos[e.photoId] = p; } });
    return JSON.stringify({ app: 'Nourish', format: 1, exportedAt: new Date().toISOString(), data: state, photos }, null, includePhotos ? 0 : 1);
  }
  const stamp = () => todayKey();
  const exportBackup = () => saveFile(`nourish-backup-${stamp()}.json`, buildBackup(ui.exportPhotos), 'application/json');
  const csvCell = (v) => { const s = v == null ? '' : String(v); return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  function exportMealsCSV() {
    const head = ['date', 'meal', 'food', 'quantity', 'unit', 'grams', 'energy_kcal', 'protein_g', 'carbs_g', 'fat_g', 'fiber_g', 'notes', 'photo_description'];
    const rows = state.entries.slice().sort((a, b) => a.date.localeCompare(b.date) || MEALS.findIndex(m => m.key === a.meal) - MEALS.findIndex(m => m.key === b.meal)).map(e => {

      return [e.date, MEAL_MAP[e.meal].label, e.name, e.qty, e.unit, n.known && n.grams != null ? round(n.grams, 1) : '', n.known ? round(n.kcal, 1) : '',
        n.known && n.p != null ? round(n.p, 1) : '', n.known && n.c != null ? round(n.c, 1) : '', n.known && n.f != null ? round(n.f, 1) : '', n.known && n.fib != null ? round(n.fib, 1) : '', e.notes, e.photoDesc];

  async function copyBackup() {

  function openImportDialog() {
    const m = openModal({
      title: 'Restore a backup', wide: true,
      body: `<p class="small muted">Choose a Nourish backup file (.json), or paste its contents. Restoring replaces everything currently in this browser.</p>
        <label class="btn btn-outline" style="align-self:flex-start" tabindex="0" role="button" id="imp-file-btn">${icon('upload', 'icon-sm')} Choose backup file<input type="file" accept=".json,application/json" class="sr-only" id="imp-file" tabindex="-1"></label>
        <div class="field"><label for="imp-text">Or paste backup text</label><textarea id="imp-text" class="textarea" style="min-height:140px;font-family:ui-monospace,Menlo,monospace;font-size:12px" placeholder='{"app":"Nourish", …}'></textarea></div>
        <span class="field-error" id="imp-err" hidden></span>`,
      foot: `<button type="button" class="btn btn-outline" data-close>Cancel</button><button type="button" class="btn btn-primary" id="imp-go">Restore</button>`,
      onMount: (root) => {
        const err = (msg) => { const el = $('#imp-err', root); el.textContent = msg; el.hidden = !msg; };
        $('#imp-file-btn', root).addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('#imp-file', root).click(); } });
        $('#imp-file', root).addEventListener('change', (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const r = new FileReader();
          r.onload = () => { $('#imp-text', root).value = String(r.result || ''); err(''); toast(`Loaded ${file.name}. Press Restore to continue.`); };
          r.onerror = () => err('That file couldn’t be read.');
          r.readAsText(file);
        });
        $('#imp-go', root).addEventListener('click', async () => {
          let parsed;
          try { parsed = JSON.parse($('#imp-text', root).value); } catch (e) { err('This isn’t valid backup text. Choose the .json file Nourish exported.'); return; }
          const data = parsed && parsed.app === 'Nourish' && parsed.data ? parsed.data : (parsed && Array.isArray(parsed.entries) ? parsed : null);
          if (!data) { err('This file isn’t a Nourish backup.'); return; }
          const ok = await confirmDialog({ title: 'Replace current data?', message: `The backup has ${(data.entries || []).length} food entries and ${(data.activities || []).length} activities. Everything currently in Nourish on this browser will be replaced.`, confirmLabel: 'Replace data' });
          if (!ok) return;
          Store.photoIds().forEach(id => Store.removePhoto(id));
          state = sanitizeState(data);
          let missing = 0;
          const photos = parsed.photos || {};
          state.entries.forEach(e => {
            if (!e.photoId) return;
            if (photos[e.photoId]) { if (!Store.setPhoto(e.photoId, photos[e.photoId])) { e.photoId = null; missing++; } }
            else { e.photoId = null; e.photoDesc = e.photoDesc || ''; missing++; }
          });
          commit(); applyTheme(); m.close(); render({ animate: true });
          toast(missing ? `Backup restored. ${missing} photo${missing === 1 ? ' wasn’t' : 's weren’t'} included or didn’t fit.` : 'Backup restored');
        });
      }
    });
  }

    } else if (form.id === 'plan-form') {
      e.preventDefault();
      state.weeklyPlan = readPlanInputs().map(v => Math.round(v));
      state.weeklyTraining = readPlanTypes();
      state.meta.demoPlan = false;
      commit(); refresh();
      toast('Weekly plan saved. Daily limits updated.');
    }
  });

  window.addEventListener('hashchange', () => { closeAllModals(); render({ animate: true, focus: true }); });
  window.addEventListener('resize', debounce(drawCharts, 150));
  window.addEventListener('storage', (e) => { if (e.key === STORE_KEY) { state = sanitizeState(Store.load()); applyTheme(); refresh(); } });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);

  // Start
  if (firstRun) seedDemo();
  applyTheme();
  updateSaveNote();
  render({ animate: true });
  setTimeout(() => { getDownloads(); }, 1500);

  // Exposed for automated checks only
  window.__nourish = { state: () => state, targetFor, computeTarget, entryNutrition, unitGrams, searchFoods, bmrOf, weekSummary, findFood, localAssistant, applyActions };
})();

</script>
<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
